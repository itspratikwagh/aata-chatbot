<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AATA Enrollment Assistant</title>
<style>
  /* ===================================================================
     AATA Enrollment Assistant — ELEGANT v3
     Color palette aligned to AATA brand cyan #00AEEF + indigo accent.
     ALL VISUAL CHANGES ARE IN THIS <style> BLOCK — markup/JS unchanged.
     To revert: point the iframe at aata-chatbot-embed-classic.html.
     =================================================================== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* Brand (constant across themes) */
    --aata-cyan: #00AEEF;
    --aata-cyan-dark: #0089BD;
    --aata-indigo: #6366f1;

    /* Surface palette — LIGHT theme defaults */
    --bg-page:        #f6fbfe;
    --bg-page-grad-1: rgba(0,174,239,0.10);
    --bg-page-grad-2: rgba(99,102,241,0.08);
    --bg-container:   #ffffff;
    --bg-surface:     #ffffff;       /* assistant bubbles, cards */
    --bg-mist:        #f8fafc;       /* input area, footer */
    --bg-header-grad-from: #ffffff;
    --bg-header-grad-to:   #f6fbfe;
    --bg-messages-tint:    rgba(0,174,239,0.025);

    --fg-ink:       #0f172a;         /* headings, primary text */
    --fg-ink-soft:  #475569;         /* sublabels */
    --fg-muted:     #94a3b8;         /* footer, hints */
    --fg-bubble:    #1e293b;         /* assistant bubble text */

    --border-soft:  #e2e8f0;
    --border-input: #e2e8f0;

    /* Quick-question pill */
    --pill-bg:     rgba(0,174,239,0.06);
    --pill-border: rgba(0,174,239,0.30);
    --pill-fg:     #075985;

    /* Inner cards (status check, email capture, SF flow) */
    --card-success-bg:     #f0fdf4;
    --card-success-border: #22c55e;
    --card-success-title:  #065f46;
    --card-warning-bg:     #fef9c3;
    --card-warning-border: #f59e0b;
    --card-info-bg:        #f0f9ff;
    --card-info-border:    #0ea5e9;
    --card-body-fg:        #334155;

    /* Container shadow */
    --shadow-container:
      0 20px 60px -20px rgba(0,174,239,0.25),
      0 12px 30px -12px rgba(15,23,42,0.18),
      0 0 0 1px rgba(0,174,239,0.08);
  }

  /* ── DARK theme overrides ── */
  [data-theme="dark"] {
    --bg-page:        #0b1220;
    --bg-page-grad-1: rgba(0,174,239,0.14);
    --bg-page-grad-2: rgba(99,102,241,0.12);
    --bg-container:   #111a2c;
    --bg-surface:     #1a2540;        /* assistant bubbles */
    --bg-mist:        #0f1827;
    --bg-header-grad-from: #131d33;
    --bg-header-grad-to:   #0f1827;
    --bg-messages-tint:    rgba(0,174,239,0.05);

    --fg-ink:       #f1f5f9;
    --fg-ink-soft:  #cbd5e1;
    --fg-muted:     #64748b;
    --fg-bubble:    #e2e8f0;

    --border-soft:  #1f2b44;
    --border-input: #2a3a5c;

    --pill-bg:     rgba(0,174,239,0.12);
    --pill-border: rgba(0,174,239,0.40);
    --pill-fg:     #67e8f9;

    --card-success-bg:     rgba(34,197,94,0.10);
    --card-success-border: #22c55e;
    --card-success-title:  #86efac;
    --card-warning-bg:     rgba(245,158,11,0.12);
    --card-warning-border: #f59e0b;
    --card-info-bg:        rgba(14,165,233,0.10);
    --card-info-border:    #0ea5e9;
    --card-body-fg:        #cbd5e1;

    --shadow-container:
      0 20px 60px -20px rgba(0,0,0,0.7),
      0 12px 30px -12px rgba(0,0,0,0.5),
      0 0 0 1px rgba(0,174,239,0.12);
  }
  /* Smooth theme transition on the elements that change color */
  body, .chat-container, .header, .messages, .input-area, .footer,
  .bubble, .quick-btn, .input-area input, .send-btn,
  .email-capture-box, .status-card-inner, .sf-flow-container, .sf-flow-header, .sf-flow-note,
  .theme-toggle {
    transition: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
  }

  /* ── Theme toggle button ── */
  .theme-toggle {
    width: 34px;
    height: 34px;
    margin-left: 4px;
    border-radius: 10px;
    border: 1px solid var(--border-soft);
    background: var(--bg-mist);
    color: var(--fg-ink-soft);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    line-height: 1;
    padding: 0;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
  }
  .theme-toggle:hover {
    color: var(--aata-cyan);
    border-color: var(--aata-cyan);
    transform: scale(1.05);
  }
  .theme-toggle:active { transform: scale(0.95); }
  .theme-toggle .theme-icon-sun,
  .theme-toggle .theme-icon-moon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.25s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  /* Light theme: show MOON (click to go dark) */
  .theme-toggle .theme-icon-sun  { opacity: 0; transform: rotate(-90deg) scale(0.6); }
  .theme-toggle .theme-icon-moon { opacity: 1; transform: rotate(0)      scale(1); }
  /* Dark theme: show SUN (click to go light) */
  [data-theme="dark"] .theme-toggle .theme-icon-sun  { opacity: 1; transform: rotate(0)     scale(1); }
  [data-theme="dark"] .theme-toggle .theme-icon-moon { opacity: 0; transform: rotate(90deg) scale(0.6); }


  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background:
      radial-gradient(1200px 600px at 20% 0%, var(--bg-page-grad-1), transparent 60%),
      radial-gradient(900px 500px at 100% 100%, var(--bg-page-grad-2), transparent 60%),
      var(--bg-page);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .chat-container {
    width: 100%;
    max-width: 800px;
    height: 95vh;
    max-height: 900px;
    display: flex;
    flex-direction: column;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: var(--shadow-container);
    background: var(--bg-container);
    position: relative;
  }

  /* ── Header (light, premium) ── */
  .header {
    background: linear-gradient(180deg, var(--bg-header-grad-from) 0%, var(--bg-header-grad-to) 100%);
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid var(--border-soft);
    position: relative;
  }
  /* subtle gradient accent strip along the very top */
  .header::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--aata-cyan), var(--aata-indigo), var(--aata-cyan));
    background-size: 200% 100%;
    animation: aata-header-flow 8s linear infinite;
  }
  @keyframes aata-header-flow { to { background-position: 200% 0; } }
  .header-avatar {
    width: 46px; height: 46px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--aata-cyan), var(--aata-indigo));
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
    box-shadow:
      0 8px 24px -6px rgba(0,174,239,0.55),
      inset 0 -2px 6px rgba(0,0,0,0.12);
    position: relative;
  }
  .header-avatar::after {
    /* soft halo */
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 18px;
    background: radial-gradient(circle, rgba(0,174,239,0.25), transparent 70%);
    z-index: -1;
    animation: aata-halo 3s ease-in-out infinite;
  }
  @keyframes aata-halo {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.08); }
  }
  .header-text h1 {
    color: var(--fg-ink);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.2px;
  }
  .header-text p {
    color: var(--fg-ink-soft);
    font-size: 12px;
    margin-top: 2px;
  }
  /* "Online" pill (replaces lonely dot) — matches the embed page badge */
  .status-dot {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px 5px 8px;
    background: rgba(34,197,94,0.10);
    border: 1px solid rgba(34,197,94,0.28);
    color: #15803d;
    font-size: 11px;
    font-weight: 600;
    border-radius: 999px;
    /* turn the bare dot into a labeled pill via a pseudo */
    width: auto; height: auto; box-shadow: none;
  }
  .status-dot::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 0 0 rgba(34,197,94,0.7);
    animation: aata-status-pulse 2s ease-out infinite;
  }
  .status-dot::after { content: "Online"; }
  @keyframes aata-status-pulse {
    0%   { box-shadow: 0 0 0 0   rgba(34,197,94,0.6); }
    70%  { box-shadow: 0 0 0 8px rgba(34,197,94,0);   }
    100% { box-shadow: 0 0 0 0   rgba(34,197,94,0);   }
  }

  /* ── Messages ── */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px 10px;
    scroll-behavior: smooth;
    background:
      linear-gradient(180deg, var(--bg-messages-tint) 0%, transparent 120px),
      var(--bg-container);
  }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb {
    background: rgba(0,174,239,0.25);
    border-radius: 999px;
  }
  .messages::-webkit-scrollbar-thumb:hover { background: rgba(0,174,239,0.5); }

  .message {
    display: flex;
    margin-bottom: 14px;
    animation: aata-msg-in 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes aata-msg-in {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0)    scale(1); }
  }
  /* legacy class kept so existing JS references still animate */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .message.user { justify-content: flex-end; }
  .message.assistant { justify-content: flex-start; }
  .bot-avatar {
    width: 32px; height: 32px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--aata-cyan), var(--aata-indigo));
    display: flex; align-items: center; justify-content: center;
    margin-right: 10px; flex-shrink: 0; margin-top: 4px;
    font-size: 14px;
    color: #fff;
    box-shadow: 0 4px 10px -2px rgba(0,174,239,0.4);
  }
  .bubble {
    max-width: 80%;
    padding: 12px 16px;
    font-size: 14.5px;
    line-height: 1.55;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .message.user .bubble {
    background: linear-gradient(135deg, var(--aata-cyan), #1e90f5);
    color: #fff;
    border-radius: 18px 18px 4px 18px;
    box-shadow:
      0 6px 18px -8px rgba(0,174,239,0.55),
      0 2px 6px -2px rgba(0,0,0,0.12);
  }
  .message.assistant .bubble {
    background: var(--bg-surface);
    color: var(--fg-bubble);
    border-radius: 18px 18px 18px 4px;
    border: 1px solid var(--border-soft);
    box-shadow: 0 2px 8px -4px rgba(15,23,42,0.08);
  }
  .bubble strong { font-weight: 600; }
  .message.user .bubble strong { color: #ffffff; }
  .bubble a { color: var(--aata-cyan); text-decoration: underline; text-underline-offset: 2px; }
  .message.user .bubble a { color: #ffffff; }

  /* ── Typing indicator ── */
  .typing { display: flex; gap: 5px; padding: 12px 4px; align-items: center; }
  .typing-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--aata-cyan);
    opacity: 0.55;
    animation: aata-bounce 1.3s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.30s; }
  @keyframes aata-bounce {
    0%, 60%, 100% { transform: translateY(0);    opacity: 0.45; }
    30%           { transform: translateY(-7px); opacity: 1; }
  }
  /* legacy keyframe alias in case anything still references it */
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-8px); }
  }

  /* ── Quick questions ── */
  .quick-questions {
    padding: 6px 18px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .quick-btn {
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--pill-border);
    background: var(--pill-bg);
    color: var(--pill-fg);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04);
  }
  .quick-btn:hover {
    background: linear-gradient(135deg, var(--aata-cyan), var(--aata-indigo));
    border-color: transparent;
    color: #fff;
    transform: translateY(-1px);
    box-shadow: 0 6px 14px -6px rgba(0,174,239,0.55);
  }
  .quick-btn:active { transform: translateY(0); }

  /* ── Input area ── */
  .input-area {
    padding: 14px 18px;
    border-top: 1px solid var(--border-soft);
    display: flex;
    gap: 10px;
    background: linear-gradient(180deg, var(--bg-header-grad-from) 0%, var(--bg-mist) 100%);
  }
  .input-area input {
    flex: 1;
    padding: 12px 18px;
    border-radius: 999px;
    border: 1.5px solid var(--border-soft);
    font-size: 14px;
    outline: none;
    background: var(--bg-container);
    color: var(--fg-ink);
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .input-area input::placeholder {
    color: var(--fg-muted);
    opacity: 0.8;
  }
  .input-area input:focus {
    border-color: var(--aata-cyan);
    box-shadow: 0 0 0 4px rgba(0,174,239,0.12);
  }
  .send-btn {
    width: 46px; height: 46px;
    border-radius: 50%;
    border: none;
    background: var(--border-input);
    color: #fff;
    font-size: 18px;
    cursor: default;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.25s ease;
    flex-shrink: 0;
  }
  .send-btn.active {
    background: linear-gradient(135deg, var(--aata-cyan), var(--aata-indigo));
    cursor: pointer;
    box-shadow: 0 6px 16px -4px rgba(0,174,239,0.55);
  }
  .send-btn.active:hover { transform: translateY(-1px) scale(1.04); }
  .send-btn.active:active { transform: translateY(0) scale(0.98); }

  .footer {
    text-align: center;
    padding: 8px 0 12px;
    font-size: 11px;
    color: var(--fg-muted);
    background: var(--bg-mist);
    letter-spacing: 0.3px;
  }

  /* ── Reduced motion ── */
  @media (prefers-reduced-motion: reduce) {
    .header::before,
    .header-avatar::after,
    .status-dot::before,
    .message,
    .typing-dot { animation: none !important; }
  }

  /* ── Salesforce Flow Iframe Styles ── */
  .sf-flow-wrapper {
    max-width: 92%;
    animation: fadeIn 0.3s ease;
  }
  .sf-flow-container {
    background: var(--bg-container);
    border: 2px solid #00AEEF;
    border-radius: 12px;
    overflow: hidden;
    margin-top: 4px;
    box-shadow: 0 2px 12px rgba(0,174,239,0.15);
  }
  .sf-flow-header {
    text-align: center;
    color: var(--aata-cyan);
    font-size: 15px;
    font-weight: 700;
    padding: 12px 16px 8px;
    border-bottom: 1px solid var(--border-soft);
  }
  .sf-flow-iframe {
    width: 100%;
    min-height: 600px;
    border: none;
    display: block;
  }
  .sf-flow-note {
    text-align: center;
    font-size: 11px;
    color: var(--fg-ink-soft);
    padding: 8px;
    border-top: 1px solid var(--border-soft);
    line-height: 1.4;
  }
  .sf-flow-loading {
    text-align: center;
    padding: 40px 16px;
    color: var(--fg-ink-soft);
    font-size: 14px;
  }
  .sf-flow-loading .spinner {
    display: inline-block;
    width: 32px; height: 32px;
    border: 3px solid var(--border-soft);
    border-top-color: var(--aata-cyan);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Flow completed button ── */
  .flow-done-btn {
    display: block;
    margin: 10px auto;
    padding: 10px 24px;
    background: #22c55e;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .flow-done-btn:hover { background: #16a34a; }

  /* ── Email capture for status check ── */
  .email-capture {
    max-width: 92%;
    animation: fadeIn 0.3s ease;
  }
  .email-capture-box {
    background: var(--card-info-bg);
    border: 2px solid var(--card-info-border);
    border-radius: 12px;
    padding: 16px;
    margin-top: 4px;
  }
  .email-capture-box p {
    font-size: 13px;
    color: var(--card-body-fg);
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .email-capture-box .email-input-row {
    display: flex;
    gap: 8px;
  }
  .email-capture-box input[type="email"] {
    flex: 1;
    padding: 8px 14px;
    border: 1px solid var(--border-input);
    background: var(--bg-container);
    color: var(--fg-ink);
    border-radius: 8px;
    font-size: 13px;
    outline: none;
  }
  .email-capture-box input[type="email"]:focus {
    border-color: var(--aata-cyan);
    box-shadow: 0 0 0 3px rgba(0,174,239,0.12);
  }
  .email-capture-box button {
    padding: 8px 18px;
    background: linear-gradient(135deg, var(--aata-cyan), var(--aata-indigo));
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 10px -4px rgba(0,174,239,0.55);
    transition: transform 0.15s ease;
  }
  .email-capture-box button:hover { transform: translateY(-1px); }

  /* ── Status result card ── */
  .status-card {
    max-width: 92%;
    animation: fadeIn 0.3s ease;
  }
  .status-card-inner {
    background: var(--card-success-bg);
    border: 2px solid var(--card-success-border);
    border-radius: 12px;
    padding: 16px;
    margin-top: 4px;
  }
  .status-card-inner.not-found {
    background: var(--card-warning-bg);
    border-color: var(--card-warning-border);
  }
  .status-card-inner h3 {
    font-size: 14px;
    font-weight: 700;
    color: var(--card-success-title);
    margin-bottom: 6px;
  }
  .status-card-inner p {
    font-size: 13px;
    color: var(--card-body-fg);
    line-height: 1.5;
  }
</style>
<script>
  // Inline EARLY init — runs before body paints to prevent flash-of-light
  // when the user prefers dark or last chose dark. Reads:
  //   1. localStorage key 'aata-theme' ('dark' | 'light')
  //   2. system preference (prefers-color-scheme: dark) if no stored choice
  (function () {
    try {
      var saved = localStorage.getItem('aata-theme');
      var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (sysDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) { /* localStorage blocked — default light */ }
  })();
</script>
</head>
<body>

<div class="chat-container" id="app">
  <div class="header">
    <div class="header-avatar">✈️</div>
    <div class="header-text">
      <h1>AATA Enrollment Assistant</h1>
      <p>American Aerospace Technical Academy</p>
    </div>
    <div class="status-dot"></div>
    <button
      class="theme-toggle"
      id="themeToggle"
      type="button"
      onclick="aataToggleTheme()"
      aria-label="Toggle dark mode"
      title="Toggle dark mode">
      <span class="theme-icon-sun" aria-hidden="true">☀</span>
      <span class="theme-icon-moon" aria-hidden="true">☾</span>
    </button>
  </div>

  <div class="messages" id="messages"></div>

  <div class="quick-questions" id="quickQuestions">
    <button class="quick-btn" onclick="sendQuick(this)">When is the next class?</button>
    <button class="quick-btn" onclick="sendQuick(this)">I'm ready to enroll!</button>
    <button class="quick-btn" onclick="sendQuick(this)">Is tuition really free?</button>
    <button class="quick-btn" onclick="sendQuick(this)">What programs do you offer?</button>
    <button class="quick-btn" onclick="sendQuick(this)">What careers can I get after?</button>
    <button class="quick-btn" onclick="sendQuick(this)">Talk to someone</button>
    <button class="quick-btn" onclick="checkEnrollmentStatus()">Check my enrollment status</button>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Ask about enrollment, programs, tuition..." onkeydown="handleKey(event)" oninput="updateSend()" />
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>

let config = {
  mode: "proxy",
  apiKey: "",
  // Ordered list of proxy BASE URLs (no trailing path). First is primary;
  // rest are backups for automatic failover. When the primary fails (network
  // error, timeout, 5xx) the chatbot tries the next URL AND promotes the
  // winner to the front for the rest of the session so subsequent calls
  // skip the dead proxy. Add more URLs here to add more redundancy.
  //
  // Added Render backup after Railway-wide outage on 2026-05-19.
  proxyBases: [
    "https://aata-proxy-production.up.railway.app",  // primary (Railway)
    "https://aata-proxy.onrender.com",               // backup (Render free tier)
  ],
  proxyTimeoutMs: 8000, // per-attempt timeout before failing over to next base
  // Legacy single-URL field — kept in sync with the current preferred proxy
  // so any code path that still reads config.proxyUrl gets the active URL.
  proxyUrl: "https://aata-proxy-production.up.railway.app/api/chat",
  salesforceFlowUrl: "https://americanaerospacetechnicalacademy.my.site.com/enroll",
};

// ============================================================
// PROXY FAILOVER — tries each base in config.proxyBases in order
// with a per-attempt timeout. On success, promotes that base to the
// front of the list for the rest of the session (no repeated cold
// starts). Throws only if EVERY proxy fails.
// ============================================================
async function fetchProxyWithFallback(path, init) {
  const bases = config.proxyBases;
  const errors = [];
  for (let i = 0; i < bases.length; i++) {
    const base = bases[i];
    const url = base + path;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), config.proxyTimeoutMs);
    try {
      const res = await fetch(url, { ...init, signal: ctrl.signal });
      clearTimeout(timer);
      // 4xx is a real response — return it (don't fail over). Only fail over
      // on 5xx or network errors, since 4xx means the proxy is alive and
      // responding (just rejecting this specific request).
      if (res.status >= 500) {
        errors.push(`${url}: HTTP ${res.status}`);
        continue;
      }
      // SUCCESS — promote this base so the rest of the session skips dead ones.
      if (i > 0) {
        config.proxyBases = [base, ...bases.filter((b) => b !== base)];
        config.proxyUrl = base + "/api/chat";
        console.warn(`[AATA chatbot] Proxy failover: now using ${base}. Earlier errors: ${errors.join(" | ")}`);
      }
      return res;
    } catch (e) {
      clearTimeout(timer);
      errors.push(`${url}: ${e.name === "AbortError" ? "timeout" : e.message}`);
    }
  }
  throw new Error(`All proxies failed: ${errors.join(" | ")}`);
}

async function callClaudeAPI(userMessage) {
  conversationHistory.push({ role: "user", content: userMessage });

  if (config.mode === "proxy") {
    const res = await fetchProxyWithFallback("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: conversationHistory }),
    });
    if (!res.ok) throw new Error(`Proxy error: ${res.status}`);
    const data = await res.json();
    const reply = data.content?.[0]?.text || data.reply || data.message || JSON.stringify(data);
    conversationHistory.push({ role: "assistant", content: reply });
    return reply;
  }

  if (config.mode === "direct") {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": config.apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: "claude-haiku-4-5-20251001",
        max_tokens: 1024,
        system: SYSTEM_PROMPT,
        messages: conversationHistory,
      }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `API error: ${res.status}`);
    }
    const data = await res.json();
    const reply = data.content[0].text;
    conversationHistory.push({ role: "assistant", content: reply });
    return reply;
  }

  throw new Error("No API configured");
}

async function getResponse(userMessage) {
  if (config.mode === "offline") {
    return "Please connect to Claude AI for the full enrollment experience.";
  }
  try {
    return await callClaudeAPI(userMessage);
  } catch (err) {
    console.error("API error:", err);
    return `⚠️ I had trouble connecting to the AI service (${err.message}). Please try again or contact us directly at info@aatatraining.org or 323-761-9066.`;
  }
}

function renderMessage(role, text) {
  if (role !== "assistant") {
    renderMessageBubble(role, text);
    return;
  }

  // Process special form markers
  let remaining = text;

  // Handle [RESEND_EMAILS]{"email":"..."} marker — chatbot wants us to re-trigger
  // the Foothill + Payment emails for a student who signed but didn't receive them.
  const resendMatch = remaining.match(/\[RESEND_EMAILS\]\s*(\{[\s\S]*?\})\s*$/);
  if (resendMatch) {
    const before = remaining.slice(0, resendMatch.index).trim();
    if (before) renderMessageBubble(role, before);
    let payload;
    try { payload = JSON.parse(resendMatch[1]); }
    catch (e) {
      renderMessageBubble(role, "⚠️ I couldn't read your email correctly. Can you type it again?");
      console.error("RESEND_EMAILS JSON parse failed:", e, resendMatch[1]);
      return;
    }
    resendEnrollmentEmails(payload.email);
    return;
  }

  // Handle [CREATE_ENROLLMENT]{...json...} marker — Claude has finished collecting
  // basic info and asks us to POST to /api/create-enrollment.
  const createMatch = remaining.match(/\[CREATE_ENROLLMENT\]\s*(\{[\s\S]*?\})\s*$/);
  if (createMatch) {
    const before = remaining.slice(0, createMatch.index).trim();
    if (before) renderMessageBubble(role, before);
    let payload;
    try {
      payload = JSON.parse(createMatch[1]);
    } catch (e) {
      renderMessageBubble(role, "⚠️ I had trouble formatting your enrollment data. Please try again, or contact info@aatatraining.org.");
      console.error("CREATE_ENROLLMENT JSON parse failed:", e, createMatch[1]);
      return;
    }
    submitEnrollment(payload);
    return;
  }

  // Render any remaining text
  if (remaining.trim()) {
    renderMessageBubble(role, remaining.trim());
  }
}

// Show a "submitting…" card, POST to Railway, then show success or error
async function resendEnrollmentEmails(email) {
  const container = document.getElementById("messages");
  const wrapper = document.createElement("div");
  wrapper.className = "message assistant";
  wrapper.innerHTML = `
    <div class="bot-avatar">✈️</div>
    <div class="bubble" id="resendCard">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="typing-dot" style="background:#2563eb;width:8px;height:8px;animation:none;"></div>
        <strong>Re-sending your Foothill + payment emails…</strong>
      </div>
    </div>`;
  container.appendChild(wrapper);
  container.scrollTop = container.scrollHeight;

  try {
    const res = await fetchProxyWithFallback("/api/resend-enrollment-emails", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email }),
    });
    const data = await res.json();
    const card = document.getElementById("resendCard");
    if (!res.ok || !data.ok) {
      card.innerHTML = `<strong>⚠️ Couldn't re-send</strong><br><br>${data.error || "Unknown error"}`;
      card.style.background = "#fef9c3";
      card.style.border = "2px solid #f59e0b";
      // Failure: let Claude follow up with apology + fallback info
      conversationHistory.push({
        role: "user",
        content: `[SYSTEM: Resend result — failed: ${data.error || "unknown error"}. Apologize and offer info@aatatraining.org as fallback. Keep it to one short sentence — the user already saw an error card.]`,
      });
      setTimeout(async () => {
        isTyping = true; showTyping();
        try {
          const replyText = await callClaudeAPIRaw();
          hideTyping();
          renderMessage("assistant", replyText);
          conversationHistory.push({ role: "assistant", content: replyText });
        } catch (e) { hideTyping(); }
        isTyping = false;
      }, 600);
    } else {
      card.innerHTML = `<div style="background:#f0fdf4;border:2px solid #22c55e;border-radius:12px;padding:14px;">
        <strong style="color:#065f46;font-size:15px;">✅ Emails re-sent</strong><br>
        <div style="margin-top:6px;color:#475569;font-size:13px;line-height:1.6;">
          We just re-sent the Foothill enrollment + book fee payment emails to <strong>${email}</strong>. They should arrive within 30 seconds. Don't forget to check your spam folder.
        </div>
      </div>`;
      // Success: green card already says everything. Skip the Claude follow-up
      // to avoid the duplicate "Done — I just re-sent..." paragraph below it.
      // Just record what happened so any later turn has the context.
      conversationHistory.push({
        role: "user",
        content: `[SYSTEM_INTERNAL: Foothill + book fee resend succeeded for ${email}. The user already saw a green confirmation card, so do NOT acknowledge this in a new message — only reference it if the user asks again later.]`,
      });
    }
  } catch (err) {
    const card = document.getElementById("resendCard");
    card.innerHTML = `<strong>⚠️ Network error</strong><br><br>${err.message}`;
    card.style.background = "#fef9c3";
    card.style.border = "2px solid #f59e0b";
  }
}

async function submitEnrollment(payload) {
  // Remember the email locally so the post-DAS-signature redirect can
  // pick up where we left off (the chatbot needs to know who's returning).
  try { localStorage.setItem("aata_pending_email", payload.email || ""); } catch (e) {}

  const container = document.getElementById("messages");
  const wrapper = document.createElement("div");
  wrapper.className = "message assistant";
  wrapper.innerHTML = `
    <div class="bot-avatar">✈️</div>
    <div class="bubble" id="enrollmentSubmittingCard">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="typing-dot" style="background:#2563eb;width:8px;height:8px;animation:none;"></div>
        <strong>Submitting your enrollment to Salesforce…</strong>
      </div>
    </div>`;
  container.appendChild(wrapper);
  container.scrollTop = container.scrollHeight;

  try {
    const res = await fetchProxyWithFallback("/api/create-enrollment", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    const card = document.getElementById("enrollmentSubmittingCard");
    if (!res.ok || !data.ok) {
      card.innerHTML = `<strong>⚠️ Couldn't create your enrollment</strong><br><br>${data.error || "Unknown error"}<br><br>Please try again, or email <a href="mailto:info@aatatraining.org">info@aatatraining.org</a>.`;
      card.style.background = "#fef9c3";
      card.style.border = "2px solid #f59e0b";
      // Tell Claude what happened so it can recover
      conversationHistory.push({
        role: "user",
        content: `[SYSTEM: Enrollment submission failed: ${data.error || "unknown error"}. Apologize and offer to either retry or escalate to info@aatatraining.org.]`,
      });
    } else {
      card.innerHTML = `
        <div style="background:#f0fdf4;border:2px solid #22c55e;border-radius:12px;padding:14px;">
          <strong style="color:#065f46;font-size:15px;">✅ Enrollment submitted!</strong><br>
          <div style="margin-top:8px;color:#475569;font-size:13px;line-height:1.6;">
            <strong>Class:</strong> ${data.className || payload.classSelection}<br>
            <strong>Start date:</strong> ${data.classStartDate || "TBA"}<br><br>
            ${data.message || "DAS 1 e-signature email will arrive within 1-2 minutes."}
          </div>
        </div>`;
      conversationHistory.push({
        role: "user",
        content: `[SYSTEM: Enrollment created successfully in Salesforce (Contact ${data.contactId}, Class "${data.className}"). The DAS 1 Apprenticeship Agreement will arrive in their email within 1-2 minutes via Box Sign. After they sign it, two emails will follow automatically: Foothill College enrollment + book fee payment. Tell the student to watch their inbox and reassure them no more chatbot steps are needed.]`,
      });
    }
    // Auto-continue conversation so Claude responds to the system message
    setTimeout(async () => {
      isTyping = true;
      showTyping();
      try {
        const replyText = await callClaudeAPIRaw();
        hideTyping();
        renderMessage("assistant", replyText);
        conversationHistory.push({ role: "assistant", content: replyText });
      } catch (e) {
        hideTyping();
      }
      isTyping = false;
    }, 600);
    container.scrollTop = container.scrollHeight;
  } catch (err) {
    const card = document.getElementById("enrollmentSubmittingCard");
    card.innerHTML = `<strong>⚠️ Network error</strong><br><br>${err.message}. Please retry or email <a href="mailto:info@aatatraining.org">info@aatatraining.org</a>.`;
    card.style.background = "#fef9c3";
    card.style.border = "2px solid #f59e0b";
    console.error(err);
  }
}

// Helper: call Claude with the current history without appending a new user message
async function callClaudeAPIRaw() {
  if (config.mode === "proxy") {
    const r = await fetchProxyWithFallback("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: conversationHistory }),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();
    return j.content?.[0]?.text || "";
  }
  // direct mode
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": config.apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-haiku-4-5-20251001",
      max_tokens: 1024,
      messages: conversationHistory,
    }),
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const j = await r.json();
  return j.content?.[0]?.text || "";
}

function renderMessageBubble(role, text) {
  const container = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = `message ${role}`;

  let html = "";
  if (role === "assistant") {
    html += '<div class="bot-avatar">✈️</div>';
  }

  // Markdown: headers, bold, links, bullets, line breaks
  let formatted = text
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/^#{1,4}\s+(.+)$/gm, "<strong>$1</strong>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/^\s*[-•]\s+/gm, "• ")
    .replace(/^\s*\d+\.\s+/gm, function(match) { return match.trim() + " "; })
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>')
    .replace(/(www\.[^\s<]+)/g, '<a href="https://$1" target="_blank">$1</a>');

  html += `<div class="bubble">${formatted}</div>`;
  div.innerHTML = html;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  messageCount++;
}

function showTyping() {
  const container = document.getElementById("messages");
  const div = document.createElement("div");
  div.id = "typingIndicator";
  div.className = "message assistant";
  div.innerHTML = '<div class="bot-avatar">✈️</div><div class="bubble"><div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function hideTyping() {
  document.getElementById("typingIndicator")?.remove();
}

async function sendMessage(overrideText) {
  const input = document.getElementById("userInput");
  const text = overrideText || input.value.trim();
  if (!text || isTyping) return;

  input.value = "";
  updateSend();
  renderMessage("user", text);

  if (messageCount > 2) {
    document.getElementById("quickQuestions").style.display = "none";
  }

  isTyping = true;
  showTyping();

  const reply = await getResponse(text);

  hideTyping();
  renderMessage("assistant", reply);
  isTyping = false;
  input.focus();
}

function sendQuick(btn) {
  sendMessage(btn.textContent);
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function updateSend() {
  const btn = document.getElementById("sendBtn");
  const val = document.getElementById("userInput").value.trim();
  btn.className = val && !isTyping ? "send-btn active" : "send-btn";
}

// ── Init ──
loadAvailableClasses(); // Fetch live class data from Salesforce

// Detect ?das=signed / ?das=declined redirect from Box Sign post-signature flow
const dasParam = new URLSearchParams(window.location.search).get("das");
if (dasParam === "signed") {
  // Student just signed the DAS via Box. Read the email we stored during
  // enrollment so the bot can offer to send the next two emails on demand.
  let savedEmail = "";
  try { savedEmail = localStorage.getItem("aata_pending_email") || ""; } catch (e) {}

  if (savedEmail) {
    renderMessage("assistant",
      "🎉 **Thanks for signing your DAS 1 Apprenticeship Agreement!**\n\n" +
      "Two more steps before you're fully enrolled:\n\n" +
      "1. **Apply to Foothill College** (we'll send you the link + a short walkthrough video)\n" +
      "2. **Pay the $325 book fee** (we'll send you the payment options)\n\n" +
      `Whenever you're ready, just say **"yes"** and I'll email both to **${savedEmail}** right now. (Or let me know if you'd prefer a different email.)`
    );
    // Prime the bot with the context so the next user message ("yes" / "ready" / etc.)
    // triggers the [RESEND_EMAILS] marker for this email.
    conversationHistory.push({
      role: "user",
      content: `[SYSTEM: Student just signed the DAS. Their email on file is "${savedEmail}". You greeted them and asked if they're ready for the Foothill + book-fee emails. When they confirm with anything affirmative ("yes", "ready", "please send", "go", "yep", etc.), emit a single message ending with the marker [RESEND_EMAILS]{"email":"${savedEmail}"} on its own line. If they ask to use a different email, capture it and use that one in the marker instead. Do not emit the marker until they confirm.]`
    });
  } else {
    renderMessage("assistant",
      "🎉 **Thanks for signing your DAS 1 Apprenticeship Agreement!**\n\n" +
      "Two more steps before you're fully enrolled — Foothill College application and the $325 book fee. " +
      "I can email both to you right now. **What email did you sign up with?**"
    );
    conversationHistory.push({
      role: "user",
      content: `[SYSTEM: Student just signed the DAS but we don't have their email in this browser session (likely a different device). You asked them what email they signed up with. Once they reply with a valid-looking email, confirm "Got it — sending both now to <email>" and emit a single message ending with the marker [RESEND_EMAILS]{"email":"<that email>"} on its own line.]`
    });
  }
} else if (dasParam === "declined") {
  renderMessage("assistant",
    "I see you didn't sign the DAS 1 Apprenticeship Agreement just now — no problem.\n\n" +
    "The DAS form is required by the State of California to complete enrollment. " +
    "Want to walk through it together, or do you have questions about what's on it? I'm happy to help."
  );
} else {
  renderMessage("assistant", "Welcome to the **American Aerospace Technical Academy (AATA)** Enrollment Assistant! ✈️\n\nI'm here to help you learn about our NDT training programs and guide you through enrollment.\n\nWhat would you like to know? You can type a question or tap one of the quick options below!");
}
