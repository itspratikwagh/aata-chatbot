<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AATA Enrollment Assistant</title>
<style>
  /* ===================================================================
     AATA Enrollment Assistant — ELEGANT v3
     Color palette aligned to AATA brand cyan #00AEEF + indigo accent.
     ALL VISUAL CHANGES ARE IN THIS <style> BLOCK — markup/JS unchanged.
     To revert: point the iframe at aata-chatbot-embed-classic.html.
     =================================================================== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* Brand (constant across themes) */
    --aata-cyan: #00AEEF;
    --aata-cyan-dark: #0089BD;
    --aata-indigo: #6366f1;

    /* Surface palette — LIGHT theme defaults */
    --bg-page:        #f6fbfe;
    --bg-page-grad-1: rgba(0,174,239,0.10);
    --bg-page-grad-2: rgba(99,102,241,0.08);
    --bg-container:   #ffffff;
    --bg-surface:     #ffffff;       /* assistant bubbles, cards */
    --bg-mist:        #f8fafc;       /* input area, footer */
    --bg-header-grad-from: #ffffff;
    --bg-header-grad-to:   #f6fbfe;
    --bg-messages-tint:    rgba(0,174,239,0.025);

    --fg-ink:       #0f172a;         /* headings, primary text */
    --fg-ink-soft:  #475569;         /* sublabels */
    --fg-muted:     #94a3b8;         /* footer, hints */
    --fg-bubble:    #1e293b;         /* assistant bubble text */

    --border-soft:  #e2e8f0;
    --border-input: #e2e8f0;

    /* Quick-question pill */
    --pill-bg:     rgba(0,174,239,0.06);
    --pill-border: rgba(0,174,239,0.30);
    --pill-fg:     #075985;

    /* Inner cards (status check, email capture, SF flow) */
    --card-success-bg:     #f0fdf4;
    --card-success-border: #22c55e;
    --card-success-title:  #065f46;
    --card-warning-bg:     #fef9c3;
    --card-warning-border: #f59e0b;
    --card-info-bg:        #f0f9ff;
    --card-info-border:    #0ea5e9;
    --card-body-fg:        #334155;

    /* Container shadow */
    --shadow-container:
      0 20px 60px -20px rgba(0,174,239,0.25),
      0 12px 30px -12px rgba(15,23,42,0.18),
      0 0 0 1px rgba(0,174,239,0.08);
  }

  /* ── DARK theme overrides ── */
  [data-theme="dark"] {
    --bg-page:        #0b1220;
    --bg-page-grad-1: rgba(0,174,239,0.14);
    --bg-page-grad-2: rgba(99,102,241,0.12);
    --bg-container:   #111a2c;
    --bg-surface:     #1a2540;        /* assistant bubbles */
    --bg-mist:        #0f1827;
    --bg-header-grad-from: #131d33;
    --bg-header-grad-to:   #0f1827;
    --bg-messages-tint:    rgba(0,174,239,0.05);

    --fg-ink:       #f1f5f9;
    --fg-ink-soft:  #cbd5e1;
    --fg-muted:     #64748b;
    --fg-bubble:    #e2e8f0;

    --border-soft:  #1f2b44;
    --border-input: #2a3a5c;

    --pill-bg:     rgba(0,174,239,0.12);
    --pill-border: rgba(0,174,239,0.40);
    --pill-fg:     #67e8f9;

    --card-success-bg:     rgba(34,197,94,0.10);
    --card-success-border: #22c55e;
    --card-success-title:  #86efac;
    --card-warning-bg:     rgba(245,158,11,0.12);
    --card-warning-border: #f59e0b;
    --card-info-bg:        rgba(14,165,233,0.10);
    --card-info-border:    #0ea5e9;
    --card-body-fg:        #cbd5e1;

    --shadow-container:
      0 20px 60px -20px rgba(0,0,0,0.7),
      0 12px 30px -12px rgba(0,0,0,0.5),
      0 0 0 1px rgba(0,174,239,0.12);
  }
  /* Smooth theme transition on the elements that change color */
  body, .chat-container, .header, .messages, .input-area, .footer,
  .bubble, .quick-btn, .input-area input, .send-btn,
  .email-capture-box, .status-card-inner, .sf-flow-container, .sf-flow-header, .sf-flow-note,
  .theme-toggle {
    transition: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
  }

  /* ── Theme toggle button ── */
  .theme-toggle {
    width: 34px;
    height: 34px;
    margin-left: 4px;
    border-radius: 10px;
    border: 1px solid var(--border-soft);
    background: var(--bg-mist);
    color: var(--fg-ink-soft);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    line-height: 1;
    padding: 0;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
  }
  .theme-toggle:hover {
    color: var(--aata-cyan);
    border-color: var(--aata-cyan);
    transform: scale(1.05);
  }
  .theme-toggle:active { transform: scale(0.95); }
  .theme-toggle .theme-icon-sun,
  .theme-toggle .theme-icon-moon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.25s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  /* Light theme: show MOON (click to go dark) */
  .theme-toggle .theme-icon-sun  { opacity: 0; transform: rotate(-90deg) scale(0.6); }
  .theme-toggle .theme-icon-moon { opacity: 1; transform: rotate(0)      scale(1); }
  /* Dark theme: show SUN (click to go light) */
  [data-theme="dark"] .theme-toggle .theme-icon-sun  { opacity: 1; transform: rotate(0)     scale(1); }
  [data-theme="dark"] .theme-toggle .theme-icon-moon { opacity: 0; transform: rotate(90deg) scale(0.6); }


  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background:
      radial-gradient(1200px 600px at 20% 0%, var(--bg-page-grad-1), transparent 60%),
      radial-gradient(900px 500px at 100% 100%, var(--bg-page-grad-2), transparent 60%),
      var(--bg-page);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .chat-container {
    width: 100%;
    max-width: 800px;
    height: 95vh;
    max-height: 900px;
    display: flex;
    flex-direction: column;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: var(--shadow-container);
    background: var(--bg-container);
    position: relative;
  }

  /* ── Header (light, premium) ── */
  .header {
    background: linear-gradient(180deg, var(--bg-header-grad-from) 0%, var(--bg-header-grad-to) 100%);
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid var(--border-soft);
    position: relative;
  }
  /* subtle gradient accent strip along the very top */
  .header::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--aata-cyan), var(--aata-indigo), var(--aata-cyan));
    background-size: 200% 100%;
    animation: aata-header-flow 8s linear infinite;
  }
  @keyframes aata-header-flow { to { background-position: 200% 0; } }
  .header-avatar {
    width: 46px; height: 46px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--aata-cyan), var(--aata-indigo));
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
    box-shadow:
      0 8px 24px -6px rgba(0,174,239,0.55),
      inset 0 -2px 6px rgba(0,0,0,0.12);
    position: relative;
  }
  .header-avatar::after {
    /* soft halo */
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 18px;
    background: radial-gradient(circle, rgba(0,174,239,0.25), transparent 70%);
    z-index: -1;
    animation: aata-halo 3s ease-in-out infinite;
  }
  @keyframes aata-halo {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.08); }
  }
  .header-text h1 {
    color: var(--fg-ink);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.2px;
  }
  .header-text p {
    color: var(--fg-ink-soft);
    font-size: 12px;
    margin-top: 2px;
  }
  /* "Online" pill (replaces lonely dot) — matches the embed page badge */
  .status-dot {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px 5px 8px;
    background: rgba(34,197,94,0.10);
    border: 1px solid rgba(34,197,94,0.28);
    color: #15803d;
    font-size: 11px;
    font-weight: 600;
    border-radius: 999px;
    /* turn the bare dot into a labeled pill via a pseudo */
    width: auto; height: auto; box-shadow: none;
  }
  .status-dot::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 0 0 rgba(34,197,94,0.7);
    animation: aata-status-pulse 2s ease-out infinite;
  }
  .status-dot::after { content: "Online"; }
  @keyframes aata-status-pulse {
    0%   { box-shadow: 0 0 0 0   rgba(34,197,94,0.6); }
    70%  { box-shadow: 0 0 0 8px rgba(34,197,94,0);   }
    100% { box-shadow: 0 0 0 0   rgba(34,197,94,0);   }
  }

  /* ── Messages ── */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px 10px;
    scroll-behavior: smooth;
    background:
      linear-gradient(180deg, var(--bg-messages-tint) 0%, transparent 120px),
      var(--bg-container);
  }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb {
    background: rgba(0,174,239,0.25);
    border-radius: 999px;
  }
  .messages::-webkit-scrollbar-thumb:hover { background: rgba(0,174,239,0.5); }

  .message {
    display: flex;
    margin-bottom: 14px;
    animation: aata-msg-in 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes aata-msg-in {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0)    scale(1); }
  }
  /* legacy class kept so existing JS references still animate */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .message.user { justify-content: flex-end; }
  .message.assistant { justify-content: flex-start; }
  .bot-avatar {
    width: 32px; height: 32px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--aata-cyan), var(--aata-indigo));
    display: flex; align-items: center; justify-content: center;
    margin-right: 10px; flex-shrink: 0; margin-top: 4px;
    font-size: 14px;
    color: #fff;
    box-shadow: 0 4px 10px -2px rgba(0,174,239,0.4);
  }
  .bubble {
    max-width: 80%;
    padding: 12px 16px;
    font-size: 14.5px;
    line-height: 1.55;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .message.user .bubble {
    background: linear-gradient(135deg, var(--aata-cyan), #1e90f5);
    color: #fff;
    border-radius: 18px 18px 4px 18px;
    box-shadow:
      0 6px 18px -8px rgba(0,174,239,0.55),
      0 2px 6px -2px rgba(0,0,0,0.12);
  }
  .message.assistant .bubble {
    background: var(--bg-surface);
    color: var(--fg-bubble);
    border-radius: 18px 18px 18px 4px;
    border: 1px solid var(--border-soft);
    box-shadow: 0 2px 8px -4px rgba(15,23,42,0.08);
  }
  .bubble strong { font-weight: 600; }
  .message.user .bubble strong { color: #ffffff; }
  .bubble a { color: var(--aata-cyan); text-decoration: underline; text-underline-offset: 2px; }
  .message.user .bubble a { color: #ffffff; }

  /* ── Typing indicator ── */
  .typing { display: flex; gap: 5px; padding: 12px 4px; align-items: center; }
  .typing-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--aata-cyan);
    opacity: 0.55;
    animation: aata-bounce 1.3s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.30s; }
  @keyframes aata-bounce {
    0%, 60%, 100% { transform: translateY(0);    opacity: 0.45; }
    30%           { transform: translateY(-7px); opacity: 1; }
  }
  /* legacy keyframe alias in case anything still references it */
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-8px); }
  }

  /* ── Quick questions ── */
  .quick-questions {
    padding: 6px 18px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .quick-btn {
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--pill-border);
    background: var(--pill-bg);
    color: var(--pill-fg);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04);
  }
  .quick-btn:hover {
    background: linear-gradient(135deg, var(--aata-cyan), var(--aata-indigo));
    border-color: transparent;
    color: #fff;
    transform: translateY(-1px);
    box-shadow: 0 6px 14px -6px rgba(0,174,239,0.55);
  }
  .quick-btn:active { transform: translateY(0); }

  /* ── Input area ── */
  .input-area {
    padding: 14px 18px;
    border-top: 1px solid var(--border-soft);
    display: flex;
    gap: 10px;
    background: linear-gradient(180deg, var(--bg-header-grad-from) 0%, var(--bg-mist) 100%);
  }
  .input-area input {
    flex: 1;
    padding: 12px 18px;
    border-radius: 999px;
    border: 1.5px solid var(--border-soft);
    font-size: 14px;
    outline: none;
    background: var(--bg-container);
    color: var(--fg-ink);
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .input-area input::placeholder {
    color: var(--fg-muted);
    opacity: 0.8;
  }
  .input-area input:focus {
    border-color: var(--aata-cyan);
    box-shadow: 0 0 0 4px rgba(0,174,239,0.12);
  }
  .send-btn {
    width: 46px; height: 46px;
    border-radius: 50%;
    border: none;
    background: var(--border-input);
    color: #fff;
    font-size: 18px;
    cursor: default;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.25s ease;
    flex-shrink: 0;
  }
  .send-btn.active {
    background: linear-gradient(135deg, var(--aata-cyan), var(--aata-indigo));
    cursor: pointer;
    box-shadow: 0 6px 16px -4px rgba(0,174,239,0.55);
  }
  .send-btn.active:hover { transform: translateY(-1px) scale(1.04); }
  .send-btn.active:active { transform: translateY(0) scale(0.98); }

  .footer {
    text-align: center;
    padding: 8px 0 12px;
    font-size: 11px;
    color: var(--fg-muted);
    background: var(--bg-mist);
    letter-spacing: 0.3px;
  }

  /* Always contain scroll inside the message list so swiping past the top/bottom
     doesn't scroll the host page (fixes iOS scroll-chaining). */
  .messages { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

  /* ── Mobile (phones & small tablets) ── */
  @media (max-width: 640px) {
    html, body {
      /* Lock the page so only the .messages list scrolls. Stops the address bar
         from collapsing/expanding while you scroll the chat. */
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      position: fixed;
      inset: 0;
      width: 100%;
    }
    body {
      /* dvh = dynamic viewport height — accounts for iOS URL bar correctly */
      height: 100dvh;
      display: block;            /* drop the centering wrapper on mobile */
    }
    .chat-container {
      width: 100%;
      max-width: none;
      height: 100dvh;
      max-height: none;
      border-radius: 0;          /* full-bleed, no wasted edge gutters */
      box-shadow: none;
    }

    /* Tighten the header on small screens */
    .header { padding: 10px 14px; gap: 10px; }
    .header-avatar { width: 38px; height: 38px; font-size: 18px; border-radius: 12px; }
    .header-text h1 { font-size: 14px; }
    .header-text p  { font-size: 11px; }
    .status-dot { padding: 3px 8px 3px 6px; font-size: 10px; }

    /* Message area — slightly tighter padding for more vertical room */
    .messages { padding: 14px 12px 6px; }

    /* Quick questions: single horizontally-swipeable row instead of wrapping
       3-4 rows that eat the whole screen. */
    .quick-questions {
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 4px 12px 8px;
      gap: 6px;
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      /* Hide the scrollbar but keep functionality */
      scrollbar-width: none;
    }
    .quick-questions::-webkit-scrollbar { display: none; }
    .quick-btn {
      flex: 0 0 auto;            /* don't shrink — keep label readable */
      scroll-snap-align: start;
      padding: 7px 12px;
      font-size: 12px;
      white-space: nowrap;
    }

    /* Input row — tighten padding, slightly smaller send button */
    .input-area { padding: 10px 12px; gap: 8px; }
    .input-area input { padding: 10px 14px; font-size: 14px; }
    .send-btn { width: 40px; height: 40px; font-size: 16px; }

    .footer { padding: 6px 0 8px; font-size: 10px; }
  }

  /* ── Reduced motion ── */
  @media (prefers-reduced-motion: reduce) {
    .header::before,
    .header-avatar::after,
    .status-dot::before,
    .message,
    .typing-dot { animation: none !important; }
  }

  /* ── Salesforce Flow Iframe Styles ── */
  .sf-flow-wrapper {
    max-width: 92%;
    animation: fadeIn 0.3s ease;
  }
  .sf-flow-container {
    background: var(--bg-container);
    border: 2px solid #00AEEF;
    border-radius: 12px;
    overflow: hidden;
    margin-top: 4px;
    box-shadow: 0 2px 12px rgba(0,174,239,0.15);
  }
  .sf-flow-header {
    text-align: center;
    color: var(--aata-cyan);
    font-size: 15px;
    font-weight: 700;
    padding: 12px 16px 8px;
    border-bottom: 1px solid var(--border-soft);
  }
  .sf-flow-iframe {
    width: 100%;
    min-height: 600px;
    border: none;
    display: block;
  }
  .sf-flow-note {
    text-align: center;
    font-size: 11px;
    color: var(--fg-ink-soft);
    padding: 8px;
    border-top: 1px solid var(--border-soft);
    line-height: 1.4;
  }
  .sf-flow-loading {
    text-align: center;
    padding: 40px 16px;
    color: var(--fg-ink-soft);
    font-size: 14px;
  }
  .sf-flow-loading .spinner {
    display: inline-block;
    width: 32px; height: 32px;
    border: 3px solid var(--border-soft);
    border-top-color: var(--aata-cyan);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Flow completed button ── */
  .flow-done-btn {
    display: block;
    margin: 10px auto;
    padding: 10px 24px;
    background: #22c55e;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .flow-done-btn:hover { background: #16a34a; }

  /* ── Email capture for status check ── */
  .email-capture {
    max-width: 92%;
    animation: fadeIn 0.3s ease;
  }
  .email-capture-box {
    background: var(--card-info-bg);
    border: 2px solid var(--card-info-border);
    border-radius: 12px;
    padding: 16px;
    margin-top: 4px;
  }
  .email-capture-box p {
    font-size: 13px;
    color: var(--card-body-fg);
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .email-capture-box .email-input-row {
    display: flex;
    gap: 8px;
  }
  .email-capture-box input[type="email"] {
    flex: 1;
    padding: 8px 14px;
    border: 1px solid var(--border-input);
    background: var(--bg-container);
    color: var(--fg-ink);
    border-radius: 8px;
    font-size: 13px;
    outline: none;
  }
  .email-capture-box input[type="email"]:focus {
    border-color: var(--aata-cyan);
    box-shadow: 0 0 0 3px rgba(0,174,239,0.12);
  }
  .email-capture-box button {
    padding: 8px 18px;
    background: linear-gradient(135deg, var(--aata-cyan), var(--aata-indigo));
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 10px -4px rgba(0,174,239,0.55);
    transition: transform 0.15s ease;
  }
  .email-capture-box button:hover { transform: translateY(-1px); }

  /* ── Status result card ── */
  .status-card {
    max-width: 92%;
    animation: fadeIn 0.3s ease;
  }
  .status-card-inner {
    background: var(--card-success-bg);
    border: 2px solid var(--card-success-border);
    border-radius: 12px;
    padding: 16px;
    margin-top: 4px;
  }
  .status-card-inner.not-found {
    background: var(--card-warning-bg);
    border-color: var(--card-warning-border);
  }
  .status-card-inner h3 {
    font-size: 14px;

// THEME TOGGLE — flip between light and dark, persist to localStorage.
// The initial theme was set by the early-init script in <head>.
// ============================================================
// Reflect current theme on the toggle button so screen readers announce
// "pressed" vs "not pressed" correctly. Call after every theme change.
function aataSyncThemeAria() {
  var btn = document.getElementById('themeToggle');
  if (!btn) return;
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  btn.setAttribute('aria-pressed', isDark ? 'true' : 'false');
  var label = isDark ? 'Switch to light mode' : 'Switch to dark mode';
  btn.setAttribute('aria-label', label);
  btn.setAttribute('title', label);
}

function aataToggleTheme() {
  var current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  var next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('aata-theme', next); } catch (e) {}
  aataSyncThemeAria();
}

// Initial sync so the button state matches the early-init theme
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', aataSyncThemeAria);
} else {

// preference as it changes (e.g. macOS auto-switching at sunset).
if (window.matchMedia) {

    if (!localStorage.getItem('aata-theme')) {
      document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
      aataSyncThemeAria();
    }
  });

let config = {
  mode: "proxy",
  apiKey: "",
  // Ordered list of proxy BASE URLs (no trailing path). First is primary;
  // rest are backups for automatic failover. When the primary fails (network
  // error, timeout, 5xx) the chatbot tries the next URL AND promotes the
  // winner to the front for the rest of the session so subsequent calls
  // skip the dead proxy. Add more URLs here to add more redundancy.
  //
  // Added Render backup after Railway-wide outage on 2026-05-19.
  proxyBases: [
    "https://aata-proxy-production.up.railway.app",  // primary (Railway)
    "https://aata-proxy.onrender.com",               // backup (Render free tier)
  ],
  proxyTimeoutMs: 8000, // per-attempt timeout before failing over to next base
  // Legacy single-URL field — kept in sync with the current preferred proxy
  // so any code path that still reads config.proxyUrl gets the active URL.
  proxyUrl: "https://aata-proxy-production.up.railway.app/api/chat",
  salesforceFlowUrl: "https://americanaerospacetechnicalacademy.my.site.com/enroll",
};

// ============================================================
// PROXY FAILOVER — tries each base in config.proxyBases in order
// with a per-attempt timeout. On success, promotes that base to the
// front of the list for the rest of the session (no repeated cold
// starts). Throws only if EVERY proxy fails.
// ============================================================
async function fetchProxyWithFallback(path, init) {
  const bases = config.proxyBases;
  const errors = [];
  for (let i = 0; i < bases.length; i++) {
    const base = bases[i];
    const url = base + path;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), config.proxyTimeoutMs);
    try {
      const res = await fetch(url, { ...init, signal: ctrl.signal });
      clearTimeout(timer);
      // 4xx is a real response — return it (don't fail over). Only fail over
      // on 5xx or network errors, since 4xx means the proxy is alive and
      // responding (just rejecting this specific request).
      if (res.status >= 500) {
        errors.push(`${url}: HTTP ${res.status}`);
        continue;
      }
      // SUCCESS — promote this base so the rest of the session skips dead ones.
      if (i > 0) {
        config.proxyBases = [base, ...bases.filter((b) => b !== base)];
        config.proxyUrl = base + "/api/chat";
        console.warn(`[AATA chatbot] Proxy failover: now using ${base}. Earlier errors: ${errors.join(" | ")}`);
      }
      return res;
    } catch (e) {
      clearTimeout(timer);
      errors.push(`${url}: ${e.name === "AbortError" ? "timeout" : e.message}`);
    }
  }
  throw new Error(`All proxies failed: ${errors.join(" | ")}`);
}
let conversationHistory = [];
let isTyping = false;
let messageCount = 0;
let availableClasses = []; // Fetched live from Salesforce

// ============================================================
// CONVERSATION LOGGING — every chat is upserted to Salesforce
// (Chatbot_Conversation__c) keyed by sessionId. Debounced during the
// session, flushed via sendBeacon on page hide.
// ============================================================
const sessionStartedAt = new Date().toISOString();
// HTML-escape any dynamic value before interpolating into innerHTML.
// Centralized so we don't have to remember at every interpolation site.
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

let sessionId;
try {
  sessionId = sessionStorage.getItem("aata_chat_session_id");
  if (!sessionId) {
    sessionId = (crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : "s-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
    sessionStorage.setItem("aata_chat_session_id", sessionId);
  }
} catch (e) {
  sessionId = "s-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
}

// Mutable session metadata — populated as the conversation progresses
const sessionMeta = {
  email: null, firstName: null, lastName: null, phone: null,
  track: null, contactId: null, enrollmentCreated: false,
};

let _logDebounceTimer = null;
let _logInflight = false;
let _logDirty = false;

function buildLogPayload(ended) {
  // Map conversationHistory into a transcript array. Skip system markers
  // (lines starting with "[SYSTEM" or "[SYSTEM_INTERNAL") because they're
  // internal coordination, not real student/bot turns.
  const transcript = [];
  for (const m of conversationHistory) {
    if (!m || !m.role || !m.content) continue;
    const c = typeof m.content === "string" ? m.content : "";
    if (c.startsWith("[SYSTEM") || c.startsWith("[CREATE_") || c.startsWith("[TX_")) continue;
    transcript.push({ role: m.role, content: c });
  }
  // Only send `ended` when true — keeps the field monotonic on the server,
  // so a stale in-flight unended write can't overwrite a beacon's ended:true.
  const out = {
    sessionId,
    startedAt: sessionStartedAt,
    transcript,
    messageCount: transcript.length,
    email: sessionMeta.email,
    firstName: sessionMeta.firstName,
    lastName: sessionMeta.lastName,
    phone: sessionMeta.phone,
    track: sessionMeta.track || "Unknown",
    contactId: sessionMeta.contactId,
    enrollmentCreated: sessionMeta.enrollmentCreated,
    source: "chatbot-embed",
    pageUrl: (location && location.href) ? location.href.slice(0, 255) : "",
  };
  if (ended) out.ended = true;
  return out;
}

function flushLog(ended) {
  // Don't log empty sessions
  if (conversationHistory.length === 0) return;
  const payload = buildLogPayload(ended);
  const json = JSON.stringify(payload);

  // On page hide, prefer sendBeacon — fire-and-forget, survives navigation.
  // Send to ALL proxy bases (Railway + Render) since sendBeacon can't observe
  // success/failure. Worst case: a duplicate upsert (server uses Session_Id__c
  // external ID so the second write is just a harmless idempotent update).
  if (ended && navigator.sendBeacon) {
    try {
      const blob = new Blob([json], { type: "application/json" });
      const bases = (config.proxyBases && config.proxyBases.length)
        ? config.proxyBases
        : ["https://aata-proxy-production.up.railway.app"];
      let queued = false;
      for (const base of bases) {
        // sendBeacon returns false if the browser refuses (e.g., >64KB or
        // queue full). Try every base so we have at least one in-flight.
        if (navigator.sendBeacon(base + "/api/log-conversation", blob)) {
          queued = true;
        }
      }
      if (queued) {
        _logDirty = false;
        return;
      }
      // If no beacon queued (rare — large payload?), fall through to fetch
      // with keepalive, which has its own size constraints but tries hard.
    } catch (e) { /* fall through to fetch */ }
  }

  // Skip if a request is already in flight (the next debounce will catch up)
  if (_logInflight) return;
  _logInflight = true;
  _logDirty = false;
  fetchProxyWithFallback("/api/log-conversation", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: json,
    keepalive: true, // survive page navigation up to 64KB
  })
    .catch((err) => {
      console.warn("[log-conversation] failed:", err.message);
      _logDirty = true; // retry on next tick
    })
    .finally(() => { _logInflight = false; });
}

function scheduleLog() {
  _logDirty = true;
  clearTimeout(_logDebounceTimer);
  _logDebounceTimer = setTimeout(() => {
    if (_logDirty) flushLog(false);
  }, 5000);
}

// Monkey-patch every mutating method on conversationHistory to trigger a
// debounced log. push() is the main path today; splice/unshift are wrapped
// defensively so a future refactor doesn't silently disable logging.
// (conversationHistory is never reassigned, so the patch holds for the
// session.)
(function () {
  ["push", "splice", "unshift"].forEach((method) => {
    const orig = conversationHistory[method].bind(conversationHistory);
    conversationHistory[method] = function (...args) {
      const r = orig(...args);
      try { scheduleLog(); } catch (e) {}
      return r;
    };
  });
})();

// Flush on tab hide / page unload
window.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") flushLog(true);
});
window.addEventListener("pagehide", () => flushLog(true));

async function loadAvailableClasses() {
  try {
    const res = await fetchProxyWithFallback("/api/available-classes", { method: "GET" });
    const data = await res.json();
    availableClasses = data.classes || [];
    console.log("📚 Loaded " + availableClasses.length + " available classes from Salesforce");

    // Inject class info into the system prompt so Claude has live data
    if (availableClasses.length > 0) {
      let classInfo = "\n\n## LIVE CLASS AVAILABILITY (from Salesforce - do NOT use hardcoded class info, use this instead):\n";
      // Parse YYYY-MM-DD as a local-time date by passing components
      // directly. Avoids the historic ECMAScript ambiguity between
      // "2026-08-03" (UTC) and "2026-08-03T00:00:00" (local) — older
      // browsers and JS engines interpreted these inconsistently.
      const fmtYMD = (s) => {
        const [y, m, d] = (s || "").split("-").map(Number);
        if (!y || !m || !d) return s || "";
        return new Date(y, m - 1, d).toLocaleDateString("en-US", {
          month: "long", day: "numeric", year: "numeric"
        });
      };
      availableClasses.forEach((c, i) => {
        const start = fmtYMD(c.startDate);
        const end = fmtYMD(c.endDate);
        const isDay = c.name.toLowerCase().includes("day");
        const schedule = isDay ? "8 AM to 4 PM PST, Monday through Friday" : "5 PM to 10 PM PST, Monday through Friday";
        classInfo += `\n### ${c.name}\n`;
        classInfo += `- Schedule: ${schedule}\n`;
        classInfo += `- Dates: ${start} to ${end}\n`;
        classInfo += `- Spots remaining: ${c.spotsRemaining} of ${c.totalSpots}\n`;
        classInfo += `- Class ID: ${c.id}\n`;
      });
      classInfo += "\nIMPORTANT: Always use these live numbers for spots remaining. If spots are 0, tell the student the class is full.\n";

      // Append to the system prompt
      SYSTEM_PROMPT += classInfo;
    }
  } catch (err) {
    console.error("⚠️ Could not load available classes:", err.message);
  }
}

## AUTOMATED ENROLLMENT PROCESS
The enrollment is fully automated. The student does NOT fill any external form. Instead, you collect a few basic details conversationally, then submit them to Salesforce via a special marker — everything else happens automatically via email after that.

### Step 1 — Conversational data collection (the ONLY manual step)

You will collect these fields, ONE AT A TIME, conversationally. Validate as you go:

1. **First name**
2. **Last name**
3. **Email** (must contain @)
4. **Mobile phone** (US, with area code)

6. **City**
7. **State** (2-letter code)
8. **Zip code** (5 digits)
9. **Class preference** — must be one of: "Day Class" or "Night Class" (refer to LIVE CLASS AVAILABILITY section below)

- Ask for ONE field at a time. Wait for the user's reply before asking the next.
- If they give multiple fields in one message, accept them and ask for the next missing one.
- If a value looks invalid (no @ in email, fewer than 10 digits in phone), politely ask them to confirm.
- Do not ask for SSN, military, education, or ethnicity here — those go on the DAS 1 e-signature form they receive by email.

Once ALL 9 fields are collected, summarize them back ("Let me confirm: First name X, last name Y, ..."), then ask "Does that all look right?"

When they confirm, emit a single message containing ONLY the following marker as the LAST line of your response (after a friendly "Submitting your enrollment now..." sentence):

[CREATE_ENROLLMENT]{"firstName":"...","lastName":"...","email":"...","mobilePhone":"...","mailingStreet":"...","mailingCity":"...","mailingState":"...","mailingPostalCode":"...","classSelection":"Day Class"}

CRITICAL FORMAT RULES for the marker:
- Use exact key names shown above. Use "Day Class" or "Night Class" for classSelection (no dates).
- Wrap the JSON on a SINGLE line. Use double quotes only. Escape any double quotes in user data.
- Put NOTHING after the marker — it must be the last thing in your message.
- Do NOT explain the marker to the user.

## CERTIFICATION & APPRENTICESHIP STRUCTURE
This is the single most important explanation to get right. Many prospective students misunderstand that AATA certifies them as Level 1/Level 2 — it does not. Lead every "full process" question with the big-picture summary below, THEN offer to go deeper.

### The big picture (always lead with this — 4-6 sentences max)
NDT certification has TWO requirements: (1) **classroom training hours** and (2) **on-the-job training (OJT) hours**. AATA provides the 400 classroom hours. Our **partner employers** provide the OJT hours — as a PAID NDT trainee position. After you complete enough OJT in a specific method, your **employer** tests you on theory + practical and certifies you as Level 1 or Level 2 in that method. So: AATA gives you the classroom hours; the employer gives you the actual certification.

### Who issues what
- **AATA**: 400-hour Classroom Training Completion certificate listing the NDT methods you studied. Has no expiry. NOT a Level 1/2 certification.
- **Foothill College**: 27 transferable college credits + Foothill's own certificate of classroom training completion (awarded to those who complete the AATA program).
- **Your future employer**: The actual Level 1 / Level 2 certification in specific NDT methods.

ONLY the employer can certify you as Level 1 or Level 2 — not AATA, not Foothill, not any third party.

### The four phases of the journey

**Phase 1 — Classroom training (10 or 16 weeks at AATA)**
- 400 hours of instructor-led online training across 8 NDT methods
- Day class: 10 weeks (8 AM–4 PM PT, Mon–Fri). Night class: 16 weeks (5 PM–10 PM PT, Mon–Fri)
- Outcome: AATA Classroom Training Completion certificate

**Phase 2 — Employer placement (starts in the LAST 2–3 weeks of class)**
- AATA helps with resume prep and shares the partner employer list in the final 3 weeks of class
- **How applications actually work:** Students apply directly to the partner employers themselves, mentioning that they are AATA students scheduled to complete NDT training by a specific date. The employer's recruiter follows up if there's a fit and an open trainee position. AATA does NOT pre-arrange or guarantee interviews — employers need to have trainee positions open at the time
- **The exception:** When a partner employer reaches out to AATA directly with active hiring needs, we share a special application link with our students for those specific roles
- Some students secure a job offer before graduation; many others find work 3–6 months after graduating — both are completely normal
- Our certificate has no expiry date. As long as you retain the knowledge, employers will accept it
- **Strongly recommend: ask AATA for mock interview practice before any real interview** — going unprepared hurts your chances
- You can also apply to companies NOT on our partner list. If you get hired by a non-partner employer, AATA will work with that employer to add them to our ecosystem
- If you're open to working anywhere in the US (not just California), finding work is even easier

**Phase 3 — Paid NDT Trainee (accumulating OJT under supervision)**
- Starting wage: $20–22/hr as a trainee
- You perform real NDT inspections, but under the direct supervision of a Level 2 inspector or supervisor
- You cannot independently accept/reject parts yet
- You accumulate OJT hours toward Level 1 / Level 2 in whichever methods your employer uses

**Phase 4 — Employer testing → Level 2 certification**
- Once you have enough OJT hours in a method, your employer tests you on theory + practical
- Pass → you are Level 2 certified in that method by that employer
- Means: work independently (no supervision required), sign reports, make accept/reject decisions on parts

### Approximate OJT hours required for Level 2 (each employer sets their own)
| NDT Method | Approx OJT hours for Level 2 |
|---|---|
| Liquid Penetrant Testing (PT) | ~200 hours |
| Magnetic Particle Testing (MT) | ~400 hours |
| Visual Testing (VT) | ~400 hours |
| Ultrasonic Testing (UT) | ~800 hours |
| Phased Array UT (PAUT) | ~800 hours |
| Radiographic Testing (RT) | ~800 hours |
| Computed/Digital Radiography (CR/DR) | ~800 hours |
| Radiation Safety | ~6–8 months |

In the US, every employer has flexibility to set their own OJT hour requirements based on the specific applications they perform. If their requirements are too low, their clients won't trust their inspectors; if too high, nobody wants to work there long enough to certify. So actual numbers vary employer to employer.

### Level 1 vs Level 2 — what's the difference?
- Difference is just **more OJT hours = more experience**. Same methods, deeper expertise.
- Level 1 = can perform tests but cannot independently accept/reject parts
- Level 2 = can independently sign reports and make accept/reject decisions
- **Many employers skip Level 1 certification entirely** and wait until you have full Level 2 hours. Why? Level 1 doesn't add operational value to the employer (still needs supervision for accept/reject decisions), so there's no incentive to formally certify at Level 1.
- BUT you CAN ask for a raise once you hit the Level 1 OJT hour count, even without formal certification.

### Salary progression (approximate, varies by employer / region / methods)
- NDT Trainee: **$20–22/hr**
- Level 1 certified (or post-Level-1 hours): **$23–25/hr**
- Recent Level 2: **$26–36/hr** (depends on which methods you're certified in)
- Experienced Level 2: **$37–47+/hr** — depends on years of experience, skill, value added to employer, willingness to travel (random project travel or fixed multi-month rotations), and your negotiation skills
- Top experienced inspectors with overtime: **$110,000+ annually**

Industries hiring: aerospace, aviation, oil & gas, manufacturing, construction, power generation.

### Critical advice for first-time job seekers (share this whenever students ask about "best method")
AATA grads study all 8 methods but most employers only need you in 1–2 of those methods initially — that's totally normal. **Do NOT be picky about which method you start with.** Take whichever method an employer is hiring for at the time you graduate. Why: if you wait for your "favorite" method to come up, you could be waiting indefinitely. Get started, build experience, and you can pivot to preferred methods later in your career.

### The apprenticeship aspect (only mention if specifically asked)
- AATA is a **registered apprenticeship** with the California Division of Apprenticeship Standards (DAS)
- **For you as a student, this changes nothing** about how you learn or what you do — it's purely behind-the-scenes
- It's the structured way AATA receives state funding, which is why CA-resident tuition is FREE
- The state tracks where graduates find employment and for how many OJT hours, up to 2 years after graduation, to set future funding allocations
- **Foothill College manages the apprenticeship paperwork on AATA's behalf** — that's the "behind-the-scenes" side of why you enroll at Foothill. (The visible side: you get 27 college credits + Foothill's classroom-completion certificate.)

### Behavior rules for "full process" questions
When a student asks about the full certification path, training phases, apprenticeship, or how Level 1/2 works:
1. Lead with the "big picture" 4-6 sentences (classroom + OJT, AATA vs employer, who certifies what)
2. Then offer to go deeper: "Want me to walk through the four phases in detail, or focus on a specific part (employer placement, OJT hours, salary, etc.)?"
3. Do NOT dump the entire section in one message — it overwhelms.
4. If the student asks about a specific method's OJT hours, use the table; if they ask about a method not in the table, say "OJT requirements vary by method and employer, typically 200–800+ hours" rather than inventing a number.

async function submitStatusCheck() {
  const input = document.getElementById("statusEmailInput");
  const email = input?.value?.trim();
  if (!email) return;

  // Light email sanity check before sending to SF
  const emailLooksValid = /^[^\s@<>"']+@[^\s@<>"']+\.[^\s@<>"']+$/.test(email);
  if (!emailLooksValid) {
    renderMessage("assistant", "That doesn't look like a complete email address. Can you double-check it?");
    return;
  }

  const submitBtn = input.parentElement.querySelector("button");
  // Disable input
  input.disabled = true;
  if (submitBtn) submitBtn.disabled = true;
  // Re-enables the input/button so a user can retry after an error.
  const reenable = () => {
    if (input) { input.disabled = false; input.focus(); }
    if (submitBtn) submitBtn.disabled = false;
  };

  await runStatusCheck(email, reenable);
}

// Core status lookup + card render. Called by the "Check my enrollment
// status" button flow (with a reenable callback for its email input) AND
// by the [CHECK_STATUS] marker when a student asks in plain chat.
async function runStatusCheck(email, reenable) {
  reenable = reenable || function () {};
  const emailLooksValid = /^[^\s@<>"']+@[^\s@<>"']+\.[^\s@<>"']+$/.test(email);
  if (!emailLooksValid) {
    renderMessage("assistant", "That doesn't look like a complete email address. Can you double-check it?");
    return;
  }

  // Show typing
  showTyping();

  try {
    const res = await fetchProxyWithFallback(
      `/api/enrollment-status?email=${encodeURIComponent(email)}`,
      { method: "GET" }
    );
    const data = await res.json();
    hideTyping();

    const container = document.getElementById("messages");

    if (data.found && data.enrollmentStatus) {
      // Returning student — capture identity on the conversation log
      sessionMeta.email = email;
      sessionMeta.firstName = data.firstName || sessionMeta.firstName;
      if (data.contactId) sessionMeta.contactId = data.contactId;
      flushLog(false);
      // Show status card built from GROUND-TRUTH facts (DAS signed date,
      // CWID on file, book fee dollars), not the manually maintained
      // Enrollment_Status__c which can lag reality. Falls back to the old
      // status-only card if the proxy doesn't return the itemized fields.
      const PAY_FULL_LINK = "https://buy.stripe.com/aFa00i46EfPVevB6vh0VO00";
      const PAY_SPLIT_LINK = "https://buy.stripe.com/7sY14mgTqgTZ4V1cTF0VO01";
      const hasFacts = (typeof data.bookFeePaid === "number") && (data.cwidOnFile !== undefined);

      let bodyHtml;
      if (hasFacts) {
        const paid = data.bookFeePaid;
        // Per-student effective total (discounts/adjustments) — server-provided.
        const due = typeof data.bookFeeDue === "number" ? data.bookFeeDue : 325;
        const balance = typeof data.bookFeeBalance === "number" ? data.bookFeeBalance : Math.max(0, due - paid);
        const rows = [];
        // DAS
        rows.push(data.dasSigned
          ? `<p>✅ <strong>DAS 1 Agreement:</strong> signed${data.dasSignedDate ? " (" + esc(data.dasSignedDate) + ")" : ""}</p>`
          : `<p>⬜ <strong>DAS 1 Agreement:</strong> not signed yet — check your email for the Box Sign request</p>`);
        // CWID
        rows.push(data.cwidOnFile
          ? `<p>✅ <strong>Foothill CWID:</strong> on file</p>`
          : `<p>⬜ <strong>Foothill CWID:</strong> needed${data.cwidLink ? ` — <a href="${esc(data.cwidLink)}" target="_blank" rel="noopener">submit it here in 10 seconds</a>` : ""}</p>`);
        // Book fee
        if (data.fullPaid) {
          rows.push(`<p>✅ <strong>Book fee:</strong> paid in full ($${paid.toFixed(2)})</p>`);
        } else if (paid > 0) {
          rows.push(`<p>🔶 <strong>Book fee:</strong> $${paid.toFixed(2)} of $${due.toFixed(2)} received — $${balance.toFixed(2)} remaining · <a href="${PAY_SPLIT_LINK}" target="_blank" rel="noopener">pay the balance</a></p>`);
        } else {
          rows.push(`<p>⬜ <strong>Book fee:</strong> $${due.toFixed(2)} due · <a href="${PAY_FULL_LINK}" target="_blank" rel="noopener">pay securely here</a></p>`);
        }
        const allDone = data.dasSigned && data.cwidOnFile && data.fullPaid;
        bodyHtml = rows.join("")
          + (allDone ? `<p>🎉 Everything on our side is complete — you're all set!</p>` : "");
      } else {
        // Legacy fallback (old proxy without itemized fields)
        const statusMessages = {
          "Step 1 Complete": "Your enrollment form is submitted! Check your inbox for the DAS 1 e-signature email from Box Sign.",
          "DAS Sent": "The DAS 1 form was sent to your email for e-signature. Check your inbox (and spam).",
          "DAS Signed": "Your DAS is signed! Watch for the Foothill + book-fee emails.",
          "Emails Sent": "Check your email for the Foothill College application + book fee payment instructions.",
          "Payment Received": "Payment received! Your enrollment is almost complete.",
          "Fully Enrolled": "You're fully enrolled! Welcome to AATA! 🎉"
        };
        bodyHtml = `<p>${statusMessages[data.enrollmentStatus] || `Current status: ${esc(data.enrollmentStatus)}`}</p>`;
      }

      // Real registered class (name + true start date) beats the legacy
      // Class_Selection__c picklist ("Day Class") when the server has it.
      const classLine = data.className
        ? `${esc(data.className)}${data.classStartDate ? " — starts " + esc(data.classStartDate) : ""}`
        : (data.classSelection ? esc(data.classSelection) : "");

      const card = document.createElement("div");
      card.className = "message assistant";
      card.innerHTML = `
        <div class="bot-avatar">✈️</div>
        <div class="status-card">
          <div class="status-card-inner">
            <h3>Welcome back, ${esc(data.firstName)}!</h3>
            ${bodyHtml}
            ${classLine ? `<p><strong>Class:</strong> ${classLine}</p>` : ""}
          </div>
        </div>
      `;
      container.appendChild(card);

      // Inject ITEMIZED context so Claude speaks from facts, not the stale
      // status label — and only prompts for what's actually missing.
      const dueForFacts = typeof data.bookFeeDue === "number" ? data.bookFeeDue : 325;
      const factsLine = hasFacts
        ? `DAS signed: ${data.dasSigned ? "YES (" + (data.dasSignedDate || "") + ")" : "NO"}; ` +
          `Foothill CWID on file: ${data.cwidOnFile ? "YES" : "NO" + (data.cwidLink ? " (submit link: " + data.cwidLink + ")" : "")}; ` +
          `Book fee: $${data.bookFeePaid.toFixed(2)} of their $${dueForFacts.toFixed(2)} effective total received` +
          (dueForFacts !== 325 ? " (adjusted total — do NOT reference $325 for this student)" : "") +
          (data.fullPaid ? " (PAID IN FULL — they owe nothing)" : ` ($${(data.bookFeeBalance ?? (dueForFacts - data.bookFeePaid)).toFixed(2)} remaining)`)
        : `Enrollment Status: ${data.enrollmentStatus}`;
      // Internal staff notes: BOT CONTEXT ONLY — never shown on the card.
      const notesBlock = Array.isArray(data.internalNotes) && data.internalNotes.length
        ? ` INTERNAL STAFF NOTES (CONFIDENTIAL — never quote, never mention notes exist, never reveal names/reasons; use only to avoid wrong guidance): ` +
          data.internalNotes.map((n, i) => `(${i + 1}) ${n.date}: ${n.body}`).join(" ")
        : "";
      const classFacts = data.className
        ? `Registered class: ${data.className}` +
          (data.classStartDate ? `, starts ${data.classStartDate}` : "") +
          (data.classEndDate ? `, ends ${data.classEndDate}` : "")
        : `Registered class: unknown (do NOT state any class dates or guess a cohort)`;
      conversationHistory.push({
        role: "user",
        content: `[SYSTEM: Returning student identified. Name: ${data.firstName} ${data.lastName}, Email: ${data.email}. ${classFacts}. GROUND-TRUTH facts (trust these over any status label): ${factsLine}. Congratulate completed items; only guide them on items marked NO/remaining. Do NOT tell them to re-do or "check emails" for items already complete. Only ever cite class dates given here — never from the general class availability list.${notesBlock}]`
      });

      // Get Claude's personalized follow-up. Set isTyping=true synchronously
      // BEFORE the await so a quick second click can't double-fire.
      isTyping = true;
      setTimeout(async () => {
        showTyping();
        const reply = await getResponse(`[Returning student ${data.firstName} checked status: ${data.enrollmentStatus}]`);
        hideTyping();
        renderMessage("assistant", reply);
        isTyping = false;
      }, 500);
      // Found path leaves input disabled — they don't need to re-check.

    } else {
      // Not found
      const card = document.createElement("div");
      card.className = "message assistant";
      card.innerHTML = `
        <div class="bot-avatar">✈️</div>
        <div class="status-card">
          <div class="status-card-inner not-found">
            <h3>No enrollment found</h3>
            <p>We couldn't find an enrollment record for <strong>${esc(email)}</strong>. This could mean you haven't started the enrollment process yet, or you used a different email.</p>
          </div>
        </div>
      `;
      container.appendChild(card);

      // Let Claude guide them to start fresh. Same isTyping-before-await pattern.
      isTyping = true;
      setTimeout(async () => {
        showTyping();
        const reply = await getResponse("I checked my enrollment status but nothing was found. I may be a new student.");
        hideTyping();
        renderMessage("assistant", reply);
        isTyping = false;
      }, 500);
      reenable(); // Let them retry with a different email if they mistyped
    }
  } catch (err) {
    hideTyping();
    renderMessage("assistant", "⚠️ Sorry, I couldn't check your enrollment status right now. Please try again or contact us at info@aatatraining.org.");
    reenable();
  }

  const container = document.getElementById("messages");
  container.scrollTop = container.scrollHeight;
}

async function callClaudeAPI(userMessage) {
  conversationHistory.push({ role: "user", content: userMessage });
  // If the call throws, pop the user message back off so the next attempt
  // doesn't send a conversation ending with an unanswered user turn (which
  // Anthropic rejects, and which also pollutes the SF transcript log).
  const undoUserPush = () => {
    const last = conversationHistory[conversationHistory.length - 1];
    if (last && last.role === "user" && last.content === userMessage) {
      conversationHistory.pop();
    }
  };

  try {
    if (config.mode === "proxy") {
      const res = await fetchProxyWithFallback("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: conversationHistory }),
      });
      if (!res.ok) throw new Error(`Proxy error: ${res.status}`);
      const data = await res.json();
      const reply = data.content?.[0]?.text || data.reply || data.message || "(empty response)";
      conversationHistory.push({ role: "assistant", content: reply });
      return reply;
    }

    if (config.mode === "direct") {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": config.apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-haiku-4-5-20251001",
          max_tokens: 1024,
          system: SYSTEM_PROMPT,
          messages: conversationHistory,
        }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `API error: ${res.status}`);
      }
      const data = await res.json();
      const reply = data.content[0].text;
      conversationHistory.push({ role: "assistant", content: reply });
      return reply;
    }

    throw new Error("No API configured");
  } catch (err) {
    undoUserPush();
    throw err;
  }
}

async function getResponse(userMessage) {

// ============================================================
// UI LOGIC
// ============================================================
function renderMessage(role, text) {
  if (role !== "assistant") {
    renderMessageBubble(role, text);
    return;
  }

  // Process special form markers
  let remaining = text;

  // Handle [RESEND_EMAILS]{"email":"..."} marker — chatbot wants us to re-trigger
  // the Foothill + Payment emails for a student who signed but didn't receive them.
  const resendMatch = remaining.match(/\[RESEND_EMAILS\]\s*(\{[\s\S]*?\})\s*$/);
  if (resendMatch) {
    const before = remaining.slice(0, resendMatch.index).trim();
    if (before) renderMessageBubble(role, before);
    let payload;
    try { payload = JSON.parse(resendMatch[1]); }
    catch (e) {
      renderMessageBubble(role, "⚠️ I couldn't read your email correctly. Can you type it again?");
      console.error("RESEND_EMAILS JSON parse failed:", e, resendMatch[1]);
      return;
    }
    resendEnrollmentEmails(payload.email);
    return;
  }

  // Handle [CHECK_STATUS]{"email":"..."} marker — a student asked to check
  // their enrollment status in plain chat (not via the quick button). Run
  // the same live Salesforce lookup + status card the button flow uses.
  const statusMatch = remaining.match(/\[CHECK_STATUS\]\s*(\{[\s\S]*?\})\s*$/);
  if (statusMatch) {
    const before = remaining.slice(0, statusMatch.index).trim();
    if (before) renderMessageBubble(role, before);
    let payload;
    try { payload = JSON.parse(statusMatch[1]); }
    catch (e) {
      renderMessageBubble(role, "⚠️ I couldn't read that email correctly. Can you type it again?");
      console.error("CHECK_STATUS JSON parse failed:", e, statusMatch[1]);
      return;
    }
    runStatusCheck(String(payload.email || "").trim());
    return;
  }

  // Handle [CREATE_ENROLLMENT]{...json...} marker — Claude has finished collecting
  // basic info and asks us to POST to /api/create-enrollment.
  const createMatch = remaining.match(/\[CREATE_ENROLLMENT\]\s*(\{[\s\S]*?\})\s*$/);
  if (createMatch) {
    const before = remaining.slice(0, createMatch.index).trim();
    if (before) renderMessageBubble(role, before);
    let payload;
    try {
      payload = JSON.parse(createMatch[1]);
    } catch (e) {
      renderMessageBubble(role, "⚠️ I had trouble formatting your enrollment data. Please try again, or contact info@aatatraining.org.");
      console.error("CREATE_ENROLLMENT JSON parse failed:", e, createMatch[1]);
      return;
    }
    submitEnrollment(payload);
    return;
  }

  // Handle [CREATE_TX_LEAD]{...json...} marker — Claude has collected 4 fields
  // from a Texas prospect. POST to /api/create-tx-lead, show success card
  // with Patrick's Google Form link.
  const txMatch = remaining.match(/\[CREATE_TX_LEAD\]\s*(\{[\s\S]*?\})\s*$/);
  if (txMatch) {
    const before = remaining.slice(0, txMatch.index).trim();
    if (before) renderMessageBubble(role, before);
    let payload;
    try {
      payload = JSON.parse(txMatch[1]);
    } catch (e) {
      renderMessageBubble(role, "⚠️ I had trouble saving your details. Please try again, or call Patrick directly at (281) 676-0356.");
      console.error("CREATE_TX_LEAD JSON parse failed:", e, txMatch[1]);
      return;
    }
    submitTxLead(payload);
    return;
  }

  // Render any remaining text
  if (remaining.trim()) {
    renderMessageBubble(role, remaining.trim());
  }
}

async function callClaudeAPIRaw() {
  if (config.mode === "proxy") {

      "x-api-key": config.apiKey,

function renderMessageBubble(role, text) {
  const container = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = `message ${role}`;

  let html = "";
  if (role === "assistant") {
    html += '<div class="bot-avatar">✈️</div>';
  }

  // Markdown: headers, bold, links, bullets, line breaks.
  // STEP 0: collapse any LLM-emitted <a href="X">Y</a> down to the URL X
  // so we own the rendering and don't trust whatever attrs Claude wrote.
  // STEP 1 (linkify): extract URLs into placeholders BEFORE HTML-escaping
  // the rest of the text. This avoids the "& in URL becomes &amp; then
  // the URL regex bails at the entity boundary" bug that produced broken
  // hrefs like https://foo.com/?a=1&amp (truncated at ;).
  let formatted = text.replace(/<a\s+[^>]*href=["']([^"']+)["'][^>]*>[^<]*<\/a>/gi, "$1");
  const _anchors = [];
  formatted = formatted.replace(
    // Match https?:// OR www. then safe chars (no whitespace/quotes/HTML
    // brackets/parens/comma/semicolon). End on a non-punctuation char so
    // trailing . , stays in the sentence rather than the URL.
    /(?:https?:\/\/|www\.)[^\s<"'()<>,;]+[^\s<"'()<>,;.]/g,
    (url) => {
      const href = url.startsWith("www.") ? "https://" + url : url;
      const idx = _anchors.length;
      // Anchor's href + visible text both pre-escaped via esc() so a
      // weird URL can't break out of the attribute or inject HTML.
      _anchors.push('<a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(url) + "</a>");
      return "ANCHOR" + idx + "";
    }
  );
  // STEP 2: now safely escape the remaining text (URLs are off in sentinels)
  formatted = formatted
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/^#{1,4}\s+(.+)$/gm, "<strong>$1</strong>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/^\s*[-•]\s+/gm, "• ")
    .replace(/^\s*\d+\.\s+/gm, function (match) { return match.trim() + " "; });
  // STEP 3: restore the anchors
  formatted = formatted.replace(/ANCHOR(\d+)/g, (_, i) => _anchors[Number(i)] || "");

  html += `<div class="bubble">${formatted}</div>`;
  div.innerHTML = html;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  messageCount++;
}

const dasParam = new URLSearchParams(window.location.search).get("das");
if (dasParam === "signed") {
  // Student just signed the DAS via Box. Read the email we stored during
  // enrollment so the bot can offer to send the next two emails on demand.
  // Clear it immediately after read — once consumed, no reason to keep the
  // PII around on a possibly-shared device.
  let savedEmail = "";
  try {
    savedEmail = localStorage.getItem("aata_pending_email") || "";
    localStorage.removeItem("aata_pending_email");
  } catch (e) {}

  if (savedEmail) {
    renderMessage("assistant",
      "🎉 **Thanks for signing your DAS 1 Apprenticeship Agreement!**\n\n" +
      "Two more steps before you're fully enrolled:\n\n" +
      "1. **Apply to Foothill College** (we'll send you the link + a short walkthrough video)\n" +
      "2. **Pay the $325 book fee** (we'll send you the payment options)\n\n" +
      `Whenever you're ready, just say **"yes"** and I'll email both to **${savedEmail}** right now. (Or let me know if you'd prefer a different email.)`
    );
    // Prime the bot with the context so the next user message ("yes" / "ready" / etc.)
    // triggers the [RESEND_EMAILS] marker for this email.
    conversationHistory.push({
      role: "user",
      content: `[SYSTEM: Student just signed the DAS. Their email on file is "${savedEmail}". You greeted them and asked if they're ready for the Foothill + book-fee emails. When they confirm with anything affirmative ("yes", "ready", "please send", "go", "yep", etc.), emit a single message ending with the marker [RESEND_EMAILS]{"email":"${savedEmail}"} on its own line. If they ask to use a different email, capture it and use that one in the marker instead. Do not emit the marker until they confirm.]`
    });
  } else {
    renderMessage("assistant",
      "🎉 **Thanks for signing your DAS 1 Apprenticeship Agreement!**\n\n" +
      "Two more steps before you're fully enrolled — Foothill College application and the $325 book fee. " +
      "I can email both to you right now. **What email did you sign up with?**"
    );
    conversationHistory.push({
      role: "user",
      content: `[SYSTEM: Student just signed the DAS but we don't have their email in this browser session (likely a different device). You asked them what email they signed up with. Once they reply with a valid-looking email, confirm "Got it — sending both now to <email>" and emit a single message ending with the marker [RESEND_EMAILS]{"email":"<that email>"} on its own line.]`
    });
  }
} else if (dasParam === "declined") {
  renderMessage("assistant",
    "I see you didn't sign the DAS 1 Apprenticeship Agreement just now — no problem.\n\n" +
    "The DAS form is required by the State of California to complete enrollment. " +
    "Want to walk through it together, or do you have questions about what's on it? I'm happy to help."
  );
} else {
  renderMessage("assistant", "Welcome to the **American Aerospace Technical Academy (AATA)** Enrollment Assistant! ✈️\n\nI'm here to help you learn about our NDT training programs and guide you through enrollment.\n\nWhat would you like to know? You can type a question or tap one of the quick options below!");
}
