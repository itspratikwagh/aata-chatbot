<style>

  body {

    display: flex;

  .chat-container {

  .header-text h1 { color: #fff; font-size: 16px; font-weight: 700; }
  .header-text p { color: #94a3b8; font-size: 12px; margin-top: 2px; }
  .status-dot {

  }

  /* ── Messages ── */

    flex: 1;
    overflow-y: auto;
    padding: 16px;
    scroll-behavior: smooth;
  }
  .message {
    display: flex;
    margin-bottom: 14px;

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .message.assistant { justify-content: flex-start; }
  .bot-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1e3a5f, #2563eb);

    margin-right: 8px; flex-shrink: 0; margin-top: 4px;
    font-size: 13px;
  }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.55;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .message.user .bubble {
    background: #2563eb;
    color: #fff;
    border-radius: 16px 16px 4px 16px;
  }
  .message.assistant .bubble {
    background: #f1f5f9;
    color: #1e293b;
    border-radius: 16px 16px 16px 4px;
  }
  .bubble strong { font-weight: 600; }

  /* ── Typing indicator ── */

    border-radius: 50%;
    background: #94a3b8;

  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-8px); }
  }

  /* ── Quick questions ── */
  .quick-questions {
    padding: 4px 16px 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .quick-btn {
    padding: 6px 13px;

    background: #f8fafc;

    color: #3730a3;
  }

    display: flex;
    gap: 8px;

  }
  .input-area input {

    padding: 10px 16px;
    border-radius: 24px;
    border: 1px solid #cbd5e1;
    font-size: 14px;
    outline: none;
    background: #fff;

    align-items: center;

    overflow: hidden;
    margin-top: 4px;

<script>
// ============================================================
// CONFIGURATION
// ============================================================
let config = {
  mode: "proxy",
  apiKey: "",
  proxyUrl: "https://aata-proxy-production.up.railway.app/api/chat",
  salesforceFlowUrl: "https://americanaerospacetechnicalacademy.my.site.com/enroll",
};
let conversationHistory = [];
let isTyping = false;
let messageCount = 0;
let availableClasses = []; // Fetched live from Salesforce

// ============================================================
// FETCH AVAILABLE CLASSES FROM SALESFORCE (on page load)
// ============================================================
async function loadAvailableClasses() {
  try {
    const res = await fetch("https://aata-proxy-production.up.railway.app/api/available-classes");
    const data = await res.json();
    availableClasses = data.classes || [];
    console.log("📚 Loaded " + availableClasses.length + " available classes from Salesforce");

    // Inject class info into the system prompt so Claude has live data
    if (availableClasses.length > 0) {
      let classInfo = "\n\n## LIVE CLASS AVAILABILITY (from Salesforce - do NOT use hardcoded class info, use this instead):\n";
      availableClasses.forEach((c, i) => {
        const start = new Date(c.startDate + "T00:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
        const end = new Date(c.endDate + "T00:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
        const isDay = c.name.toLowerCase().includes("day");
        const schedule = isDay ? "8 AM to 4 PM PST, Monday through Friday" : "5 PM to 10 PM PST, Monday through Friday";
        classInfo += `\n### ${c.name}\n`;
        classInfo += `- Schedule: ${schedule}\n`;
        classInfo += `- Dates: ${start} to ${end}\n`;
        classInfo += `- Spots remaining: ${c.spotsRemaining} of ${c.totalSpots}\n`;
        classInfo += `- Class ID: ${c.id}\n`;
      });
      classInfo += "\nIMPORTANT: Always use these live numbers for spots remaining. If spots are 0, tell the student the class is full.\n";

      // Append to the system prompt
      SYSTEM_PROMPT += classInfo;
    }
  } catch (err) {
    console.error("⚠️ Could not load available classes:", err.message);
  }
}

const SYSTEM_PROMPT = `You are the official Enrollment Assistant for the American Aerospace Technical Academy (AATA). You help prospective students learn about AATA's programs and guide them step-by-step through the enrollment process. Be warm, encouraging, and professional. Keep responses concise but thorough.

## ABOUT AATA
- Full name: American Aerospace Technical Academy (AATA)
- Type: 501(c)(3) nonprofit, founded April 2015
- Mission: Empower individuals through free Nondestructive Testing (NDT) training and career development
- Founded by John Stewart, who has trained technicians for SpaceX, Goodrich Aerospace, and Northrop Grumman
- Locations: Los Angeles, California and Houston, Texas (ASNT Houston facility)
- Website: www.aatatraining.org

## PROGRAMS
- AATA offers a comprehensive 400-hour Instructor-led online NDT (Nondestructive Testing) training program
- Students receive Level I and Level II certifications
- The program is available 100% online via live video conference, Monday-Friday
- California classes are fully online with an optional 1-week hands-on in-person workshop
- There is NO difference in curriculum between Day and Night classes — only the number of weeks differs due to hours per day

### NDT Methods Covered (400 hours total):
1. Liquid Penetrant Testing (PT) - Level 1 & 2 - 40 hours
2. Magnetic Particle Testing (MT) - Level 1 & 2 - 40 hours
3. Ultrasonic Testing (UT) - Level 1 & 2 - 80 hours
4. Phased Array Ultrasonic Testing (PAUT) - Intro - 40 hours
5. Radiographic Testing (RT) - Level 1 & 2 - 80 hours
6. Radiation Safety - 40 hours
7. Visual Testing (VT) - Level 1 & 2 - 40 hours
8. Computed Radiography / Digital Radiography (CR/DR) - Intro - 40 hours

### College Credits
- Students enroll through Foothill College
- Eligible to receive 26 college credits toward a future Associate's or Bachelor's degree at Foothill College

## UPCOMING CLASSES
Class availability is loaded LIVE from Salesforce at the bottom of this prompt. Do NOT use hardcoded dates or spots — always refer to the "LIVE CLASS AVAILABILITY" section appended below for current class names, dates, and remaining spots.

IMPORTANT: Spots are limited. Always mention how many spots are left to create urgency. If a student is interested, encourage them to start the enrollment steps immediately. If spots remaining is 0, tell the student that class is full.

## TUITION & COSTS
- California Residents: Tuition is FREE. The $7,495 course fee is fully waived.
- Texas Residents: Funding available — contact Patrick Kratochvil at (281) 676-0356 or patrickaata@gmail.com for details
- Only additional cost: $325 book fee for ASNT books (brand new hard copies shipped directly from ASNT to student's home via FedEx)
- Book fee can be paid in one installment OR split into two equal payments ($162.50 each)
- Out-of-State Residents: Funding is handled on a case-by-case basis. If someone from out of state asks about funding (including veterans), direct them to leave a message at https://www.aatatraining.org/apply
- IMPORTANT: Do NOT proactively mention veteran-specific funding. There is currently no dedicated veteran funding program. If a veteran from out of state specifically asks about veteran funding, explain that funding is handled case by case and direct them to https://www.aatatraining.org/apply

### Book Fee Payment Methods:
- Zelle / Apple Cash: 424-385-1149
- Cash App: $WaghNDT
- PayPal: https://paypal.me/ppwagh
- Credit Card: https://wise.com/pay/r/8-psp-TnrS8wMEU

## ENROLLMENT REQUIREMENTS
- Prerequisites: NONE - just have a drive to learn
- California residents: Tuition is FREE
- Texas residents: Funding available through Patrick Kratochvil
- No specific degree or diploma needed
- No prior NDT experience required
- Must be 18+

## AUTOMATED ENROLLMENT PROCESS
CRITICAL: When a student says they want to enroll or sign up, guide them through the enrollment form (Step 1). The remaining steps are AUTOMATED — after Step 1, the system handles everything via email.

IMPORTANT WARNING TO SHARE WITH STUDENTS:
Due to high demand, students will NOT be considered enrolled unless ALL steps are completed. All steps must be completed for enrollment to be confirmed.

### Step 1: Complete the Enrollment Form (ONLY step the student does in the chatbot)
- When the student is ready, include the EXACT text [SHOW_ENROLLMENT_FLOW] in your response (this triggers the Salesforce enrollment form to appear inline in the chat)
- IMPORTANT: You MUST include the literal text [SHOW_ENROLLMENT_FLOW] (with brackets) in your message. Do not describe the form fields or link to an external page.
- Before showing the form, confirm which class they prefer — use the LIVE CLASS AVAILABILITY data from the bottom of this prompt for current class names, dates, and spots remaining
- The form collects personal info and class selection
- It creates a Contact record AND automatically enrolls them in the selected class
- After submission, the system automatically sends the DAS 1 Apprenticeship Agreement to their email via Box Sign for e-signature

### After Step 1 — Everything is Automated:
- The DAS 1 form (required by the State of California Division of Apprenticeship Standards) arrives in their email via Box Sign. Some fields will be pre-filled; they need to complete the remaining fields (SSN, military info, education, etc.) and sign it.
- Once they sign the DAS form, TWO emails are automatically sent:
  1. **Foothill College Enrollment** — Instructions to apply at Foothill College (required for ALL students, Foothill administers the apprenticeship program). They should select "CEA Nondestructive Testing" as their program of study.
  2. **Book Fee Payment** — $325 for ASNT books. Payment via Zelle/Apple Cash (424-385-1149), Cash App ($WaghNDT), PayPal (paypal.me/ppwagh), or credit card (contact Pratik at 424-385-1149).

### What to Tell Students After Step 1:
- "Check your email for the DAS 1 Apprenticeship Agreement from Box Sign. Review and sign it."
- "After you sign it, you'll automatically receive two more emails with instructions for Foothill College enrollment and book fee payment."
- "Once all steps are complete, you'll be fully enrolled!"

### Returning Students (Status Check):
- If the system provides a [SYSTEM: Returning student...] message, use the enrollment status to guide them:
  * Step 1 Complete / DAS Sent → Tell them to check email for the DAS form
  * DAS Signed / Emails Sent → Tell them to check email for Foothill and payment instructions
  * Payment Received → Almost done, enrollment being finalized
  * Fully Enrolled → Welcome them, they're all set!

## ENROLLMENT FLOW CONVERSATION STRATEGY
When a student says they want to enroll or are ready to sign up:
1. First, ask: "Which state do you currently reside in?"
2. Based on their answer:
   - California resident → Explain tuition is FREE, then proceed with enrollment
   - Texas resident → Direct them to contact Patrick Kratochvil at (281) 676-0356 or patrickaata@gmail.com for enrollment
   - Out-of-state resident → Explain that funding is handled case by case, and direct them to leave a message at https://www.aatatraining.org/apply
3. For CA residents: Ask which class they prefer (Day or Night) - mention spots remaining
4. Show the enrollment form with [SHOW_ENROLLMENT_FLOW]
5. After they submit, tell them about the automated next steps (DAS form via email → Foothill + Payment emails)

IMPORTANT RULES ABOUT VETERANS:
- Do NOT ask if someone is a veteran as a qualifying question
- Do NOT proactively mention veteran benefits or veteran-specific funding
- If a student independently mentions they are a veteran AND asks about funding, explain that funding is handled on a case-by-case basis and direct them to https://www.aatatraining.org/apply
- If a CA or TX resident happens to be a veteran, their state residency already qualifies them for free/funded tuition — no need to bring up veteran status

## CAREER OUTLOOK
- Some AATA graduates earn $42-$47/hour
- With overtime, that adds up to $110,000+ annually within a couple of years of experience
- Industries: Aerospace, aviation, oil & gas, manufacturing, construction, power generation

## CONTACT
- General / California: info@aatatraining.org
- Houston / Texas: Patrick Kratochvil at (281) 676-0356 or patrickaata@gmail.com
- Pratik Wagh (enrollment confirmation): +1 424-385-1149
- Apply online / Leave a message: www.aatatraining.org/apply
- Website: www.aatatraining.org

## CONNECTING TO A LIVE AGENT
If a student asks to speak with a person, be connected to an agent, or wants to talk to someone:
- Direct them to call: 323-761-9066
- If the call doesn't go through, ask them to email: info@aatatraining.org
- Do NOT provide any other phone numbers for live agent requests — only 323-761-9066

## BEHAVIOR GUIDELINES
- IMPORTANT: Do NOT use markdown headers (# or ##) in your responses. Use **bold text** for emphasis instead.
- Always be encouraging - many prospective students may be nervous about a career change
- If someone is a CA resident, highlight that tuition is FREE enthusiastically
- If someone is a TX resident, warmly direct them to Patrick Kratochvil for enrollment
- NEVER proactively mention veteran benefits or veteran-specific funding
- Create urgency about limited spots (mention exact spots remaining for each class)
- When a CA student wants to enroll, guide them through the enrollment form, then explain the automated next steps
- If a returning student checks their status, use the enrollment status to guide them to the right step
- If you don't know something specific, direct them to contact AATA directly
- Suggest next steps proactively after answering any question
- Keep responses concise: 3-6 sentences for simple questions, more detail only when asked
- Never make up information not in your knowledge base - direct to AATA contact instead
- If asked about topics unrelated to AATA enrollment, politely redirect to enrollment topics
- Always end responses with a suggestion for what the student should do next`;

// ============================================================
// SALESFORCE FLOW EMBED (Step 1)
// ============================================================
function renderEnrollmentFlow() {
  const container = document.getElementById("messages");
  const wrapper = document.createElement("div");
  wrapper.className = "message assistant";

  const flowUrl = config.salesforceFlowUrl;
  const isConfigured = flowUrl && !flowUrl.includes("PASTE_YOUR");

  if (!isConfigured) {
    // Placeholder if Flow URL not yet configured
    wrapper.innerHTML = `
      <div class="bot-avatar">✈️</div>
      <div class="sf-flow-wrapper">
        <div class="sf-flow-container" style="border-color:#f59e0b;">
          <div class="sf-flow-header" style="color:#f59e0b;">⚠️ Enrollment Form Setup Pending</div>
          <div style="padding:20px;text-align:center;color:#64748b;font-size:13px;line-height:1.6;">
            The Salesforce enrollment form is being set up.<br>
            Please contact us directly to enroll:<br><br>
            <strong>Email:</strong> info@aatatraining.org<br>
            <strong>Call:</strong> 323-761-9066<br>
            <strong>Apply online:</strong> <a href="https://www.aatatraining.org/apply" target="_blank">www.aatatraining.org/apply</a>
          </div>
        </div>
      </div>
    `;
    container.appendChild(wrapper);
    container.scrollTop = container.scrollHeight;
    return;
  }

  wrapper.innerHTML = `
    <div class="bot-avatar">✈️</div>
    <div class="sf-flow-wrapper">
      <div class="sf-flow-container" id="enrollmentFlowContainer">
        <div class="sf-flow-header">📋 Step 1: Enrollment & Apprentice Agreement</div>
        <div class="sf-flow-loading" id="flowLoading">
          <div class="spinner"></div><br>
          Loading enrollment form...
        </div>
        <iframe
          class="sf-flow-iframe"
          id="enrollmentFlowIframe"
          src="${flowUrl}"
          onload="document.getElementById('flowLoading').style.display='none';"
          style="display:none;"
          allow="camera; microphone"
        ></iframe>
        <div class="sf-flow-note">
          This form creates your student profile and captures the DAS Apprentice Agreement.<br>
          Your information is securely stored in AATA's Salesforce system.
        </div>
        <button class="flow-done-btn" onclick="handleFlowCompleted()">
          ✅ I've submitted the form — continue to Step 2
        </button>
      </div>
    </div>
  `;
  container.appendChild(wrapper);
  container.scrollTop = container.scrollHeight;

  // Show iframe once loaded
  const iframe = document.getElementById("enrollmentFlowIframe");
  iframe.addEventListener("load", function() {
    iframe.style.display = "block";
    container.scrollTop = container.scrollHeight;
  });
}

function handleFlowCompleted() {
  // Update the flow container to show success
  const flowContainer = document.getElementById("enrollmentFlowContainer");
  flowContainer.innerHTML = `
    <div style="text-align:center;padding:20px;color:#065f46;font-weight:600;font-size:14px;">
      ✅ Enrollment form submitted successfully!<br>
      <span style="font-weight:400;font-size:13px;color:#475569;">Your student profile has been created and you've been enrolled in your selected class.</span>
    </div>
  `;

  // Notify Claude that Step 1 is done — new automated workflow
  conversationHistory.push({
    role: "user",
    content: "[SYSTEM: Student has successfully completed the Salesforce enrollment form (Step 1). A Contact record and Class Registration have been created. The system will now automatically send the DAS 1 Apprenticeship Agreement via Box Sign to their email for e-signature. After they sign it, two emails will be sent automatically: (1) Foothill College enrollment instructions, and (2) Book fee payment information. Tell the student to check their email for the DAS 1 form to sign.]"
  });

  // Auto-continue the conversation
  setTimeout(async () => {
    isTyping = true;
    showTyping();
    const reply = await getResponse("[Student completed Step 1 — enrollment form submitted, DAS form will be sent via email]");
    hideTyping();
    renderMessage("assistant", reply);
    isTyping = false;
  }, 1000);
}

// ============================================================
// ENROLLMENT STATUS CHECK
// ============================================================
function checkEnrollmentStatus() {
  // Hide quick questions
  document.getElementById("quickQuestions").style.display = "none";

  // Show email capture UI
  const container = document.getElementById("messages");
  const wrapper = document.createElement("div");
  wrapper.className = "message assistant";
  wrapper.innerHTML = `
    <div class="bot-avatar">✈️</div>
    <div class="email-capture">
      <div class="email-capture-box">
        <p><strong>Welcome back!</strong> Enter the email you used during enrollment so I can check your progress.</p>
        <div class="email-input-row">
          <input type="email" id="statusEmailInput" placeholder="your.email@example.com" onkeydown="if(event.key==='Enter'){event.preventDefault();submitStatusCheck();}" />
          <button onclick="submitStatusCheck()">Check</button>
        </div>
      </div>
    </div>
  `;
  container.appendChild(wrapper);
  container.scrollTop = container.scrollHeight;
  document.getElementById("statusEmailInput").focus();
}

async function submitStatusCheck() {
  const input = document.getElementById("statusEmailInput");
  const email = input?.value?.trim();
  if (!email) return;

  // Disable input
  input.disabled = true;
  input.parentElement.querySelector("button").disabled = true;

  // Show typing
  showTyping();

  try {
    const res = await fetch(`https://aata-proxy-production.up.railway.app/api/enrollment-status?email=${encodeURIComponent(email)}`);
    const data = await res.json();
    hideTyping();

    const container = document.getElementById("messages");

    if (data.found && data.enrollmentStatus) {
      // Show status card
      const statusMessages = {
        "Step 1 Complete": "Your enrollment form is submitted! We've sent you the DAS 1 Apprenticeship Agreement via email for e-signature. Please check your inbox (and spam folder) for an email from Box Sign.",
        "DAS Sent": "The DAS 1 form has been sent to your email for e-signature. Please check your inbox (and spam folder) for an email from Box Sign and sign the document.",
        "DAS Signed": "Your DAS form is signed! We've sent you two emails — one with Foothill College enrollment instructions and one about the book fee payment. Check your inbox!",
        "Emails Sent": "We've sent you two important emails: (1) Foothill College application instructions, and (2) Book fee payment details ($325). Please check your inbox and complete both steps.",
        "Payment Received": "Payment received! Your enrollment is almost complete.",
        "Fully Enrolled": "You're fully enrolled! Welcome to AATA! 🎉 Your class details have been confirmed."
      };

      const statusMsg = statusMessages[data.enrollmentStatus] || `Current status: ${data.enrollmentStatus}`;

      const card = document.createElement("div");
      card.className = "message assistant";
      card.innerHTML = `
        <div class="bot-avatar">✈️</div>
        <div class="status-card">
          <div class="status-card-inner">
            <h3>Welcome back, ${data.firstName}!</h3>
            <p><strong>Enrollment Status:</strong> ${data.enrollmentStatus}</p>
            <p>${statusMsg}</p>
            ${data.classSelection ? `<p><strong>Class:</strong> ${data.classSelection}</p>` : ""}
          </div>
        </div>
      `;
      container.appendChild(card);

      // Inject context into conversation for Claude
      conversationHistory.push({
        role: "user",
        content: `[SYSTEM: Returning student identified. Name: ${data.firstName} ${data.lastName}, Email: ${data.email}, Enrollment Status: ${data.enrollmentStatus}, Class: ${data.classSelection || "unknown"}. Guide them based on their current status.]`
      });

      // Get Claude's personalized follow-up
      setTimeout(async () => {
        isTyping = true;
        showTyping();
        const reply = await getResponse(`[Returning student ${data.firstName} checked status: ${data.enrollmentStatus}]`);
        hideTyping();
        renderMessage("assistant", reply);
        isTyping = false;
      }, 500);

    } else {
      // Not found
      const card = document.createElement("div");
      card.className = "message assistant";
      card.innerHTML = `
        <div class="bot-avatar">✈️</div>
        <div class="status-card">
          <div class="status-card-inner not-found">
            <h3>No enrollment found</h3>
            <p>We couldn't find an enrollment record for <strong>${email}</strong>. This could mean you haven't started the enrollment process yet, or you used a different email.</p>
          </div>
        </div>
      `;
      container.appendChild(card);

      // Let Claude guide them to start fresh
      setTimeout(async () => {
        isTyping = true;
        showTyping();
        const reply = await getResponse("I checked my enrollment status but nothing was found. I may be a new student.");
        hideTyping();
        renderMessage("assistant", reply);
        isTyping = false;
      }, 500);
    }
  } catch (err) {
    hideTyping();
    renderMessage("assistant", "⚠️ Sorry, I couldn't check your enrollment status right now. Please try again or contact us at info@aatatraining.org.");
  }

  const container = document.getElementById("messages");
  container.scrollTop = container.scrollHeight;
}

// ============================================================
// CLAUDE API CALL
// ============================================================
async function callClaudeAPI(userMessage) {
  conversationHistory.push({ role: "user", content: userMessage });

  if (config.mode === "proxy") {
    const res = await fetch(config.proxyUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: conversationHistory }),
    });
    if (!res.ok) throw new Error(`Proxy error: ${res.status}`);
    const data = await res.json();
    const reply = data.content?.[0]?.text || data.reply || data.message || JSON.stringify(data);
    conversationHistory.push({ role: "assistant", content: reply });
    return reply;
  }

  if (config.mode === "direct") {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": config.apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: "claude-haiku-4-5-20251001",
        max_tokens: 1024,
        system: SYSTEM_PROMPT,
        messages: conversationHistory,
      }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `API error: ${res.status}`);
    }
    const data = await res.json();
    const reply = data.content[0].text;
    conversationHistory.push({ role: "assistant", content: reply });
    return reply;
  }

  throw new Error("No API configured");
}

// ============================================================
// MAIN RESPONSE HANDLER
// ============================================================
async function getResponse(userMessage) {
  if (config.mode === "offline") {
    return "Please connect to Claude AI for the full enrollment experience.";
  }
  try {
    return await callClaudeAPI(userMessage);
  } catch (err) {
    console.error("API error:", err);
    return `⚠️ I had trouble connecting to the AI service (${err.message}). Please try again or contact us directly at info@aatatraining.org or 323-761-9066.`;
  }
}

// ============================================================
// UI LOGIC
// ============================================================
function renderMessage(role, text) {
  if (role !== "assistant") {
    renderMessageBubble(role, text);
    return;
  }

  // Process special form markers
  let remaining = text;

  // Handle Salesforce Flow marker
  if (remaining.includes("[SHOW_ENROLLMENT_FLOW]")) {
    const parts = remaining.split("[SHOW_ENROLLMENT_FLOW]");
    if (parts[0].trim()) renderMessageBubble(role, parts[0].trim());
    renderEnrollmentFlow();
    remaining = parts[1] || "";
  }

  // Render any remaining text
  if (remaining.trim()) {
    renderMessageBubble(role, remaining.trim());
  }
}

function renderMessageBubble(role, text) {
  const container = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = `message ${role}`;

  let html = "";
  if (role === "assistant") {
    html += '<div class="bot-avatar">✈️</div>';
  }

  // Markdown: headers, bold, links, bullets, line breaks
  let formatted = text
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/^#{1,4}\s+(.+)$/gm, "<strong>$1</strong>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/^\s*[-•]\s+/gm, "• ")
    .replace(/^\s*\d+\.\s+/gm, function(match) { return match.trim() + " "; })
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>')
    .replace(/(www\.[^\s<]+)/g, '<a href="https://$1" target="_blank">$1</a>');

  html += `<div class="bubble">${formatted}</div>`;
  div.innerHTML = html;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  messageCount++;
}

function showTyping() {
  const container = document.getElementById("messages");
  const div = document.createElement("div");
  div.id = "typingIndicator";
  div.className = "message assistant";
  div.innerHTML = '<div class="bot-avatar">✈️</div><div class="bubble"><div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function hideTyping() {
  document.getElementById("typingIndicator")?.remove();
}

async function sendMessage(overrideText) {
  const input = document.getElementById("userInput");
  const text = overrideText || input.value.trim();
  if (!text || isTyping) return;

  input.value = "";
  updateSend();
  renderMessage("user", text);

  if (messageCount > 2) {
    document.getElementById("quickQuestions").style.display = "none";
  }

  isTyping = true;
  showTyping();

  const reply = await getResponse(text);

  hideTyping();
  renderMessage("assistant", reply);
  isTyping = false;
  input.focus();
}

function sendQuick(btn) {
  sendMessage(btn.textContent);
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function updateSend() {
  const btn = document.getElementById("sendBtn");
  const val = document.getElementById("userInput").value.trim();
  btn.className = val && !isTyping ? "send-btn active" : "send-btn";
}
