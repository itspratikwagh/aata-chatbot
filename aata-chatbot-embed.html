let config = {

let conversationHistory = [];

let availableClasses = []; // Fetched live from Salesforce

// ============================================================
// FETCH AVAILABLE CLASSES FROM SALESFORCE (on page load)
// ============================================================
async function loadAvailableClasses() {
  try {
    const res = await fetch("https://aata-proxy-production.up.railway.app/api/available-classes");
    const data = await res.json();
    availableClasses = data.classes || [];
    console.log("📚 Loaded " + availableClasses.length + " available classes from Salesforce");

    // Inject class info into the system prompt so Claude has live data
    if (availableClasses.length > 0) {
      let classInfo = "\n\n## LIVE CLASS AVAILABILITY (from Salesforce - do NOT use hardcoded class info, use this instead):\n";
      availableClasses.forEach((c, i) => {
        const start = new Date(c.startDate + "T00:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
        const end = new Date(c.endDate + "T00:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
        const isDay = c.name.toLowerCase().includes("day");
        const schedule = isDay ? "8 AM to 4 PM PST, Monday through Friday" : "5 PM to 10 PM PST, Monday through Friday";
        classInfo += `\n### ${c.name}\n`;
        classInfo += `- Schedule: ${schedule}\n`;
        classInfo += `- Dates: ${start} to ${end}\n`;
        classInfo += `- Spots remaining: ${c.spotsRemaining} of ${c.totalSpots}\n`;
        classInfo += `- Class ID: ${c.id}\n`;
      });
      classInfo += "\nIMPORTANT: Always use these live numbers for spots remaining. If spots are 0, tell the student the class is full.\n";

      // Append to the system prompt
      SYSTEM_PROMPT += classInfo;
    }
  } catch (err) {
    console.error("⚠️ Could not load available classes:", err.message);
  }
}

let SYSTEM_PROMPT = `You are the official Enrollment Assistant for the American Aerospace Technical Academy (AATA). You help prospective students learn about AATA's programs and guide them step-by-step through the enrollment process. Be warm, encouraging, and professional. Keep responses concise but thorough.

## ABOUT AATA
- Full name: American Aerospace Technical Academy (AATA)
- Type: 501(c)(3) nonprofit, founded April 2015
- Mission: Empower individuals through free Nondestructive Testing (NDT) training and career development
- Founded by John Stewart, who has trained technicians for SpaceX, Goodrich Aerospace, and Northrop Grumman

### Book Fee Payment Methods:

## AUTOMATED ENROLLMENT PROCESS
The enrollment is fully automated. The student does NOT fill any external form. Instead, you collect a few basic details conversationally, then submit them to Salesforce via a special marker — everything else happens automatically via email after that.

### Step 1 — Conversational data collection (the ONLY manual step)

You will collect these fields, ONE AT A TIME, conversationally. Validate as you go:

1. **First name**
2. **Last name**
3. **Email** (must contain @)
4. **Mobile phone** (US, with area code)
5. **Mailing street address** (street + apt/unit)
6. **City**
7. **State** (2-letter code)
8. **Zip code** (5 digits)
9. **Class preference** — must be one of: "Day Class" or "Night Class" (refer to LIVE CLASS AVAILABILITY section below)

Rules for collection:
- Ask for ONE field at a time. Wait for the user's reply before asking the next.
- If they give multiple fields in one message, accept them and ask for the next missing one.
- If a value looks invalid (no @ in email, fewer than 10 digits in phone), politely ask them to confirm.
- Do not ask for SSN, military, education, or ethnicity here — those go on the DAS 1 e-signature form they receive by email.

Once ALL 9 fields are collected, summarize them back ("Let me confirm: First name X, last name Y, ..."), then ask "Does that all look right?"

When they confirm, emit a single message containing ONLY the following marker as the LAST line of your response (after a friendly "Submitting your enrollment now..." sentence):

[CREATE_ENROLLMENT]{"firstName":"...","lastName":"...","email":"...","mobilePhone":"...","mailingStreet":"...","mailingCity":"...","mailingState":"...","mailingPostalCode":"...","classSelection":"Day Class"}

CRITICAL FORMAT RULES for the marker:
- Use exact key names shown above. Use "Day Class" or "Night Class" for classSelection (no dates).
- Wrap the JSON on a SINGLE line. Use double quotes only. Escape any double quotes in user data.
- Put NOTHING after the marker — it must be the last thing in your message.
- Do NOT explain the marker to the user.

### After the marker — everything is automated:
- The DAS 1 form (required by the State of California Division of Apprenticeship Standards) arrives in their email via Box Sign. Some fields are pre-filled; they complete the remaining ones (SSN, military info, education) and sign.
- Once they sign, TWO emails are sent automatically:
  1. **Foothill College Enrollment** — apply for "CEA Nondestructive Testing" (required for ALL students)
  2. **Book Fee Payment** — $325 for ASNT books

### What to tell students after the marker:
- The frontend will show a green confirmation card with the class info.
- Then say: "Watch your email for the DAS 1 Apprenticeship Agreement from Box Sign — usually arrives in 1-2 minutes. After you sign, two more emails will follow with the Foothill College and payment instructions."

### Returning Students (Status Check):
- If the system provides a [SYSTEM: Returning student...] message, use the enrollment status to guide them:
  * Step 1 Complete / DAS Sent → Tell them to check email for the DAS form
  * DAS Signed / Emails Sent → Tell them to check email for Foothill and payment instructions
  * Payment Received → Almost done, enrollment being finalized
  * Fully Enrolled → Welcome them, they're all set!

When a student says they want to enroll or are ready to sign up:

2. Based on their answer:

3. For CA residents: collect the 9 fields one by one, confirm, then emit the [CREATE_ENROLLMENT] marker
4. After the marker is emitted, set expectations about the auto-emails and that's it — no more chatbot steps

IMPORTANT RULES ABOUT VETERANS:

## BEHAVIOR GUIDELINES
- IMPORTANT: Do NOT use markdown headers (# or ##) in your responses. Use **bold text** for emphasis instead.
- Always be encouraging - many prospective students may be nervous about a career change
- If someone is a CA resident, highlight that tuition is FREE enthusiastically

- Always end responses with a suggestion for what the student should do next`;

function renderEnrollmentFlow() {
  const container = document.getElementById("messages");
  const wrapper = document.createElement("div");
  wrapper.className = "message assistant";

  const flowUrl = config.salesforceFlowUrl;
  const isConfigured = flowUrl && !flowUrl.includes("PASTE_YOUR");

  if (!isConfigured) {
    // Placeholder if Flow URL not yet configured
    wrapper.innerHTML = `
      <div class="bot-avatar">✈️</div>
      <div class="sf-flow-wrapper">
        <div class="sf-flow-container" style="border-color:#f59e0b;">
          <div class="sf-flow-header" style="color:#f59e0b;">⚠️ Enrollment Form Setup Pending</div>
          <div style="padding:20px;text-align:center;color:#64748b;font-size:13px;line-height:1.6;">
            The Salesforce enrollment form is being set up.<br>
            Please contact us directly to enroll:<br><br>
            <strong>Email:</strong> info@aatatraining.org<br>
            <strong>Call:</strong> 323-761-9066<br>
            <strong>Apply online:</strong> <a href="https://www.aatatraining.org/apply" target="_blank">www.aatatraining.org/apply</a>
          </div>
        </div>
      </div>
    `;
    container.appendChild(wrapper);
    container.scrollTop = container.scrollHeight;
    return;
  }

  wrapper.innerHTML = `
    <div class="bot-avatar">✈️</div>
    <div class="sf-flow-wrapper">
      <div class="sf-flow-container" id="enrollmentFlowContainer">
        <div class="sf-flow-header">📋 Step 1: Enrollment & Apprentice Agreement</div>
        <div class="sf-flow-loading" id="flowLoading">
          <div class="spinner"></div><br>
          Loading enrollment form...
        </div>
        <iframe
          class="sf-flow-iframe"
          id="enrollmentFlowIframe"
          src="${flowUrl}"
          onload="document.getElementById('flowLoading').style.display='none';"
          style="display:none;"
          allow="camera; microphone"
        ></iframe>
        <div class="sf-flow-note">
          This form creates your student profile and captures the DAS Apprentice Agreement.<br>
          Your information is securely stored in AATA's Salesforce system.
        </div>
        <button class="flow-done-btn" onclick="handleFlowCompleted()">
          ✅ I've submitted the form — continue to Step 2
        </button>
      </div>
    </div>
  `;
  container.appendChild(wrapper);
  container.scrollTop = container.scrollHeight;

  // Show iframe once loaded
  const iframe = document.getElementById("enrollmentFlowIframe");
  iframe.addEventListener("load", function() {
    iframe.style.display = "block";
    container.scrollTop = container.scrollHeight;

async function submitStatusCheck() {
  const input = document.getElementById("statusEmailInput");
  const email = input?.value?.trim();
  if (!email) return;

  // Disable input
  input.disabled = true;
  input.parentElement.querySelector("button").disabled = true;

  // Show typing
  showTyping();

  try {
    const res = await fetch(`https://aata-proxy-production.up.railway.app/api/enrollment-status?email=${encodeURIComponent(email)}`);
    const data = await res.json();
    hideTyping();

    const container = document.getElementById("messages");

    if (data.found && data.enrollmentStatus) {
      // Show status card
      const statusMessages = {
        "Step 1 Complete": "Your enrollment form is submitted! We've sent you the DAS 1 Apprenticeship Agreement via email for e-signature. Please check your inbox (and spam folder) for an email from Box Sign.",
        "DAS Sent": "The DAS 1 form has been sent to your email for e-signature. Please check your inbox (and spam folder) for an email from Box Sign and sign the document.",
        "DAS Signed": "Your DAS form is signed! We've sent you two emails — one with Foothill College enrollment instructions and one about the book fee payment. Check your inbox!",
        "Emails Sent": "We've sent you two important emails: (1) Foothill College application instructions, and (2) Book fee payment details ($325). Please check your inbox and complete both steps.",
        "Payment Received": "Payment received! Your enrollment is almost complete.",
        "Fully Enrolled": "You're fully enrolled! Welcome to AATA! 🎉 Your class details have been confirmed."
      };

      const statusMsg = statusMessages[data.enrollmentStatus] || `Current status: ${data.enrollmentStatus}`;

      const card = document.createElement("div");
      card.className = "message assistant";
      card.innerHTML = `
        <div class="bot-avatar">✈️</div>
        <div class="status-card">
          <div class="status-card-inner">
            <h3>Welcome back, ${data.firstName}!</h3>
            <p><strong>Enrollment Status:</strong> ${data.enrollmentStatus}</p>
            <p>${statusMsg}</p>
            ${data.classSelection ? `<p><strong>Class:</strong> ${data.classSelection}</p>` : ""}
          </div>
        </div>
      `;
      container.appendChild(card);

      // Inject context into conversation for Claude
      conversationHistory.push({
        role: "user",
        content: `[SYSTEM: Returning student identified. Name: ${data.firstName} ${data.lastName}, Email: ${data.email}, Enrollment Status: ${data.enrollmentStatus}, Class: ${data.classSelection || "unknown"}. Guide them based on their current status.]`
      });

      // Get Claude's personalized follow-up
      setTimeout(async () => {
        isTyping = true;
        showTyping();
        const reply = await getResponse(`[Returning student ${data.firstName} checked status: ${data.enrollmentStatus}]`);
        hideTyping();
        renderMessage("assistant", reply);
        isTyping = false;
      }, 500);

    } else {
      // Not found
      const card = document.createElement("div");
      card.className = "message assistant";
      card.innerHTML = `
        <div class="bot-avatar">✈️</div>
        <div class="status-card">
          <div class="status-card-inner not-found">
            <h3>No enrollment found</h3>
            <p>We couldn't find an enrollment record for <strong>${email}</strong>. This could mean you haven't started the enrollment process yet, or you used a different email.</p>
          </div>
        </div>
      `;
      container.appendChild(card);

      // Let Claude guide them to start fresh
      setTimeout(async () => {
        isTyping = true;
        showTyping();
        const reply = await getResponse("I checked my enrollment status but nothing was found. I may be a new student.");
        hideTyping();
        renderMessage("assistant", reply);
        isTyping = false;
      }, 500);
    }
  } catch (err) {
    hideTyping();
    renderMessage("assistant", "⚠️ Sorry, I couldn't check your enrollment status right now. Please try again or contact us at info@aatatraining.org.");
  }

  const container = document.getElementById("messages");
  container.scrollTop = container.scrollHeight;
}

// ============================================================
// CLAUDE API CALL
// ============================================================
async function callClaudeAPI(userMessage) {
  conversationHistory.push({ role: "user", content: userMessage });

  if (config.mode === "proxy") {
    const res = await fetch(config.proxyUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: conversationHistory }),
    });
    if (!res.ok) throw new Error(`Proxy error: ${res.status}`);
    const data = await res.json();
    const reply = data.content?.[0]?.text || data.reply || data.message || JSON.stringify(data);
    conversationHistory.push({ role: "assistant", content: reply });
    return reply;
  }

  if (config.mode === "direct") {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": config.apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: "claude-haiku-4-5-20251001",
        max_tokens: 1024,
        system: SYSTEM_PROMPT,
        messages: conversationHistory,
      }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `API error: ${res.status}`);
    }
    const data = await res.json();
    const reply = data.content[0].text;
    conversationHistory.push({ role: "assistant", content: reply });
    return reply;
  }

  throw new Error("No API configured");
}

// ============================================================
// MAIN RESPONSE HANDLER
// ============================================================
async function getResponse(userMessage) {
  if (config.mode === "offline") {
    return "Please connect to Claude AI for the full enrollment experience.";
  }
  try {
    return await callClaudeAPI(userMessage);
  } catch (err) {
    console.error("API error:", err);
    return `⚠️ I had trouble connecting to the AI service (${err.message}). Please try again or contact us directly at info@aatatraining.org or 323-761-9066.`;
  }
}

// ============================================================
// UI LOGIC
// ============================================================
function renderMessage(role, text) {
  if (role !== "assistant") {
    renderMessageBubble(role, text);
    return;
  }

  // Process special form markers
  let remaining = text;

  // Handle [RESEND_EMAILS]{"email":"..."} marker — chatbot wants us to re-trigger
  // the Foothill + Payment emails for a student who signed but didn't receive them.
  const resendMatch = remaining.match(/\[RESEND_EMAILS\]\s*(\{[\s\S]*?\})\s*$/);
  if (resendMatch) {
    const before = remaining.slice(0, resendMatch.index).trim();
    if (before) renderMessageBubble(role, before);
    let payload;
    try { payload = JSON.parse(resendMatch[1]); }
    catch (e) {
      renderMessageBubble(role, "⚠️ I couldn't read your email correctly. Can you type it again?");
      console.error("RESEND_EMAILS JSON parse failed:", e, resendMatch[1]);
      return;
    }
    resendEnrollmentEmails(payload.email);
    return;
  }

  // Handle [CREATE_ENROLLMENT]{...json...} marker — Claude has finished collecting
  // basic info and asks us to POST to /api/create-enrollment.
  const createMatch = remaining.match(/\[CREATE_ENROLLMENT\]\s*(\{[\s\S]*?\})\s*$/);
  if (createMatch) {
    const before = remaining.slice(0, createMatch.index).trim();
    if (before) renderMessageBubble(role, before);
    let payload;
    try {
      payload = JSON.parse(createMatch[1]);
    } catch (e) {
      renderMessageBubble(role, "⚠️ I had trouble formatting your enrollment data. Please try again, or contact info@aatatraining.org.");
      console.error("CREATE_ENROLLMENT JSON parse failed:", e, createMatch[1]);
      return;
    }
    submitEnrollment(payload);
    return;
  }

  // Render any remaining text
  if (remaining.trim()) {
    renderMessageBubble(role, remaining.trim());
  }
}

// Helper: call Claude with the current history without appending a new user message
async function callClaudeAPIRaw() {
  if (config.mode === "proxy") {
    const r = await fetch(config.proxyUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: conversationHistory }),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();
    return j.content?.[0]?.text || "";
  }
  // direct mode
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": config.apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-haiku-4-5-20251001",
      max_tokens: 1024,
      messages: conversationHistory,
    }),
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const j = await r.json();
  return j.content?.[0]?.text || "";
}

function renderMessageBubble(role, text) {
  const container = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = `message ${role}`;

  let html = "";
  if (role === "assistant") {
    html += '<div class="bot-avatar">✈️</div>';
  }

  // Markdown: headers, bold, links, bullets, line breaks
  let formatted = text
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/^#{1,4}\s+(.+)$/gm, "<strong>$1</strong>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/^\s*[-•]\s+/gm, "• ")
    .replace(/^\s*\d+\.\s+/gm, function(match) { return match.trim() + " "; })
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>')
    .replace(/(www\.[^\s<]+)/g, '<a href="https://$1" target="_blank">$1</a>');

  html += `<div class="bubble">${formatted}</div>`;
  div.innerHTML = html;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  messageCount++;
}

function showTyping() {
  const container = document.getElementById("messages");
  const div = document.createElement("div");
  div.id = "typingIndicator";
  div.className = "message assistant";
  div.innerHTML = '<div class="bot-avatar">✈️</div><div class="bubble"><div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function hideTyping() {
  document.getElementById("typingIndicator")?.remove();
}

async function sendMessage(overrideText) {
  const input = document.getElementById("userInput");
  const text = overrideText || input.value.trim();
  if (!text || isTyping) return;

  input.value = "";
  updateSend();
  renderMessage("user", text);

  if (messageCount > 2) {
    document.getElementById("quickQuestions").style.display = "none";
  }

  isTyping = true;
  showTyping();

  const reply = await getResponse(text);

  hideTyping();
  renderMessage("assistant", reply);
  isTyping = false;
  input.focus();
}

function sendQuick(btn) {
  sendMessage(btn.textContent);
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function updateSend() {
  const btn = document.getElementById("sendBtn");
  const val = document.getElementById("userInput").value.trim();
  btn.className = val && !isTyping ? "send-btn active" : "send-btn";
}
